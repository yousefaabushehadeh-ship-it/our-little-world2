<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf5fb">
<title>بيتنا الصغير · Our Little World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ================= tokens ================= */
:root{--bg:#fbf5fb;--bg2:#f3ecfb;--card:#fff;--line:#efe4f3;--tx:#2b2350;--mut:#7b7899;--pk:#f6b3cf;--ac:#e8608f;--lv:#e3d9fa;--bl:#cfe7ff;--plum:#6c4ab6;--gsh:#cbbdf0;
--shadow:0 1px 2px #2b235012,0 10px 28px #6c4ab612;--fd:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;--fb:"Tajawal","Baloo Bhaijaan 2",system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141331;--bg2:#1c1a40;--card:#211f48;--line:#302c60;--tx:#f2f0ff;--mut:#a7a3cf;--pk:#7b3f63;--lv:#3a3470;--bl:#253f63;--gsh:#2a2558;--shadow:0 1px 2px #0004,0 10px 28px #0005}}
:root[data-theme="dark"]{--bg:#141331;--bg2:#1c1a40;--card:#211f48;--line:#302c60;--tx:#f2f0ff;--mut:#a7a3cf;--pk:#7b3f63;--lv:#3a3470;--bl:#253f63;--gsh:#2a2558;--shadow:0 1px 2px #0004,0 10px 28px #0005}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 var(--fb);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s;-webkit-tap-highlight-color:transparent}
#app{position:relative;z-index:1;display:flex;min-height:100vh}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:12px 16px 100px}
h1,h2,h3,.btn,.chip,nav button,.tg,.bdg{font-family:var(--fd)}
h1{font-size:25px;line-height:1.3;margin:2px 0;font-weight:800;background:linear-gradient(90deg,var(--tx),var(--ac),var(--tx));background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 7s linear infinite}
h1 .e{-webkit-text-fill-color:initial}
h2{font-size:17px;margin:0 0 10px;font-weight:700}
.mut{color:var(--mut);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--shadow);animation:up .5s both}
.msg{background:linear-gradient(135deg,var(--pk),var(--lv),var(--pk));background-size:200%;animation:up .5s both,sh 6s linear infinite;border-color:transparent}
.btn{border:0;background:linear-gradient(135deg,#f07aa4,#e0578a);color:#fff;border-radius:14px;padding:9px 16px;cursor:pointer;font-size:15px;font-weight:700;box-shadow:0 4px 0 #c94677,0 8px 16px #e8608f2e;transition:transform .12s,box-shadow .12s}
a.btn{text-decoration:none;display:inline-block}a.xp{text-decoration:none}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c94677}
.btn.g{background:var(--lv);color:var(--tx);box-shadow:0 4px 0 var(--gsh)}.btn.g:active{box-shadow:0 1px 0 var(--gsh)}
.big{font-size:18px;padding:14px 26px;border-radius:18px}
.sel{background:linear-gradient(135deg,#f07aa4,#e0578a)!important;color:#fff!important;box-shadow:0 4px 0 #c94677!important}
.x{border:0;background:none;color:var(--ac);font-size:14px;cursor:pointer;padding:4px 6px;flex:none}
input,select,textarea{background:var(--bg);color:var(--tx);border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;font:inherit;font-size:15px;max-width:100%}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px #e8608f22}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sb{justify-content:space-between}
.bar{height:12px;border-radius:9px;background:var(--lv);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#f6b3cf,#e8608f,#f6b3cf);background-size:200%;animation:sh 3s linear infinite;transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.lbl{display:flex;justify-content:space-between;font-size:13px}
.task{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s,padding .2s;animation:up .4s both}
.task:last-child{border:0}.task:hover{background:var(--bg2);padding-inline-start:10px;border-radius:12px}
.task span{flex:1;min-width:0;overflow-wrap:anywhere}
.ck{width:26px;height:26px;border-radius:9px;border:2.5px solid var(--ac);display:grid;place-items:center;font-size:14px;color:#fff;flex:none;transition:.25s}
.done .ck{background:var(--ac);animation:pop .4s}.done span{opacity:.55;text-decoration:line-through}
.xp{font-size:12px;color:var(--ac);font-style:normal;flex:none;font-weight:700}
.bubble{background:var(--lv);border-radius:16px;padding:8px 14px;margin-bottom:8px;text-align:center;font-size:14px;animation:pop2 .4s}
.pulse{animation:pls 2s infinite}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));inset-inline:12px;margin:auto;max-width:380px;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:16px;text-align:center;font-weight:500;opacity:0;transform:translateY(-30px) scale(.9);transition:.35s cubic-bezier(.3,1.5,.5,1);z-index:60;pointer-events:none;box-shadow:0 10px 30px #0003}
#toast.s{opacity:1;transform:none}
.fx{position:fixed;pointer-events:none;z-index:40;font:800 18px var(--fd);color:var(--ac);animation:fl 1.1s forwards}
.cf{position:fixed;top:-30px;z-index:40;pointer-events:none;animation:cf 2.6s linear forwards}
.hr{position:fixed;left:50%;top:50%;z-index:45;pointer-events:none;animation:hr 1.8s forwards}
.fh{position:fixed;bottom:-40px;z-index:0;pointer-events:none;opacity:.14;animation:fu linear infinite}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes sh{to{background-position:-200%}}
@keyframes pop{50%{transform:scale(1.4) rotate(8deg)}}
@keyframes pop2{from{transform:scale(.85);opacity:0}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pls{0%{box-shadow:0 0 0 0 #e8608f55}70%{box-shadow:0 0 0 14px #e8608f00}100%{box-shadow:0 0 0 0 #e8608f00}}
@keyframes fl{to{transform:translateY(-70px) scale(1.4);opacity:0}}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes hr{to{transform:translate(var(--x),-240px) scale(1.6);opacity:0}}
@keyframes fu{to{transform:translateY(-115vh) rotate(50deg)}}
@keyframes fi{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= top bar & nav ================= */
.top{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top:empty{display:none}
.brand{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--tx);cursor:pointer;font:800 18px var(--fd);padding:0}
.tr{display:flex;align-items:center;gap:8px}
.pc{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:20px}
.pc i{position:absolute;bottom:0;inset-inline-end:0;width:11px;height:11px;border-radius:50%;background:#b9b4d6;box-shadow:0 0 0 2px var(--card)}.pc i.on{background:#39c46a}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer}
nav{position:fixed;bottom:0;inset-inline:0;z-index:7;display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px #6c4ab60f}
nav:empty{display:none}
nav button{position:relative;flex:1;min-width:0;border:0;background:none;color:var(--mut);font-size:11px;font-weight:700;padding:6px 1px 4px;border-radius:14px;cursor:pointer;transition:.25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{transition:transform .25s}
nav button:hover .ic,nav button.on .ic{transform:translateY(-2px) scale(1.12)}
nav button.on{background:var(--lv);color:var(--ac)}
nav .dot{position:absolute;top:4px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 2px var(--card)}
@media(min-width:800px){nav{position:sticky;top:0;height:100vh;flex-direction:column;width:190px;padding:20px 10px;border-top:0;border-inline-end:1px solid var(--line);box-shadow:none}nav button{flex:none;flex-direction:row;gap:10px;font-size:14px;padding:10px 12px}nav .dot{top:10px;left:auto;inset-inline-end:10px}main{padding-bottom:40px}}

/* ================= the house ================= */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 4px}
.hwrap{position:relative;max-width:560px;margin-inline:auto!important;border-radius:30px;overflow:hidden;box-shadow:0 2px 4px #2b235014,0 18px 40px #6c4ab624;margin:12px 0;background:#8fd0ff;animation:up .5s both;touch-action:manipulation}
.hzoom{position:relative;transform-origin:0 0;transition:transform .45s cubic-bezier(.65,0,.35,1)}
.hzoom svg{display:block;width:100%;height:auto}
.hov{position:absolute;inset:0;pointer-events:none;transition:opacity .25s}.hzoom.look .hov{opacity:0}
.tg{position:absolute;translate:-50% 0;font-size:11px;font-weight:700;line-height:1.5;color:#2b2350;background:#ffffffe6;padding:1px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px #2b235022}
.tg i{display:inline-block;font-style:normal;background:#e8608f;color:#fff;font-size:10.5px;font-weight:800;line-height:1.45;padding:0 6px;margin-inline-start:4px;border-radius:999px;box-shadow:0 2px 6px #e8608f55;animation:bob 2s ease-in-out infinite}
.hit{fill:transparent;cursor:pointer;transition:fill .2s;outline:none}
.hit:hover{fill:#ffffff3d}.hit:focus-visible{fill:#ffffff3d;stroke:#6c4ab6;stroke-width:4}
.chr{pointer-events:none}.chr .cb{animation:cbob 2.6s ease-in-out infinite}@keyframes cbob{50%{transform:translateY(-1.5px)}}
.lulu.joy .lbody{animation:lhop .9s ease-in-out infinite}@keyframes lhop{0%,55%,100%{transform:none}25%{transform:translateY(-6px)}}
.lbr{transform-box:fill-box;transform-origin:50% 100%;animation:lbr 3s ease-in-out infinite}@keyframes lbr{50%{transform:scaleY(1.07)}}
.lulu{cursor:pointer}.lulu.walk .lbody{animation:lstep .26s ease-in-out infinite alternate}@keyframes lstep{to{transform:translateY(-1.8px)}}
.ltail{transform-box:fill-box;transform-origin:100% 100%;animation:ltw 1.4s ease-in-out infinite}@keyframes ltw{50%{transform:rotate(-16deg)}}
.think{animation:bob 1.8s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.cld{animation:drift 48s linear infinite}.cld2{animation:drift 64s linear infinite;animation-delay:-30s}@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(740px)}}
.tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
.smoke circle,.smoke path{opacity:0;transform-box:fill-box;transform-origin:center;animation:smk 3.2s ease-out infinite}@keyframes smk{0%{opacity:.85;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(18px,-50px) scale(1.9)}}
.bubs circle{animation:bfl 2.2s ease-in-out infinite alternate}@keyframes bfl{to{transform:translateY(-4px)}}
.gift{cursor:pointer;transform-box:fill-box;transform-origin:center bottom;animation:gbob 1.6s ease-in-out infinite}@keyframes gbob{0%,100%{transform:none}50%{transform:translateY(-3px) rotate(-5deg)}}
.flw{transform-box:fill-box;transform-origin:center bottom;animation:sway 3s ease-in-out infinite alternate}@keyframes sway{to{transform:rotate(5deg)}}
.luv{animation:bob 2s ease-in-out infinite}
.swg{transform-box:fill-box;transform-origin:50% 0;animation:swg 2.6s ease-in-out infinite alternate}@keyframes swg{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.fsh{animation:fsh 4s ease-in-out infinite alternate}@keyframes fsh{to{transform:translateX(-12px)}}
.lline{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 12px;margin:0 0 10px;box-shadow:var(--shadow);animation:up .5s both;font-size:14px}
.lline .lic{flex:none;width:40px;height:40px;border-radius:14px;background:var(--bl);display:grid;place-items:center;font-size:22px}
.lline>div{flex:1;min-width:0}.lline .btn{flex:none;padding:7px 12px;font-size:13.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--tx);cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.chip:active{transform:scale(.95)}.chip.hot{background:linear-gradient(135deg,var(--pk),var(--lv));border-color:transparent}
.hint{text-align:center}

/* ================= room header (zoomed house) ================= */
.rhd{position:relative;width:100%;max-width:600px;aspect-ratio:2/1;border-radius:26px;overflow:hidden;margin:4px auto 14px;box-shadow:0 2px 4px #2b235014,0 16px 34px #6c4ab620;animation:zin .5s cubic-bezier(.2,.8,.2,1) both;background:#8fd0ff}
@keyframes zin{from{transform:scale(1.08);opacity:.2}}
.rhd>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rtt{margin:-4px 4px 12px}.rtt h1{font-size:23px;margin:0}.rtt p{margin:0}
.rht{position:absolute;top:12px;inset-inline-start:12px;max-width:72%;background:#ffffffd9;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:16px;padding:6px 14px 8px;color:#2b2350;box-shadow:0 4px 14px #2b235022}
.rht h1{margin:0;font-size:21px;background:none;color:#2b2350;-webkit-text-fill-color:currentColor;animation:none}
.rht p{margin:0;font-size:13px;color:#5e5a80}
.door{position:absolute;bottom:12px;inset-inline-start:12px;display:flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:8px 14px;background:#ffffffe6;color:#2b2350;font:700 14px var(--fd);cursor:pointer;box-shadow:0 4px 0 #0000001f,0 8px 18px #2b235026;transition:transform .15s}
.door:hover{transform:translateY(-2px)}.door:active{transform:translateY(2px)}

/* ================= room objects ================= */
.tv{background:#2a2f5a;border-radius:22px;padding:10px;margin:12px 0;box-shadow:0 8px 0 #1b1f45;animation:up .5s both}
.tv .scr{border-radius:15px;padding:14px;color:#fff;background:linear-gradient(135deg,#3d5a80,#5b4b8a)}
.tv .mut{color:#dfe2fb}.tv .bar{background:#ffffff33}
.tvs{display:flex;justify-content:space-around;margin-top:10px;font-size:12.5px;text-align:center}.tvs b{display:block;font:800 19px var(--fd)}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.sticky{background:#fff3a8;color:#1e2347;border-radius:3px 3px 14px 3px;padding:12px 6px;text-align:center;font-size:12.5px;box-shadow:0 6px 12px #0002;transform:rotate(-2deg);animation:up .5s both}
.sticky:nth-child(2){background:#ffd1e3;transform:rotate(1.5deg)}.sticky:nth-child(3){background:#cfe9ff;transform:rotate(-1deg)}
.sticky b{display:block;font:800 21px var(--fd)}
.paper{position:relative;margin:14px 0;padding:16px 16px 14px;padding-inline-start:38px;border-radius:6px 20px 20px 6px;background:#fffdf6;color:#1e2347;box-shadow:0 6px 18px #0000001f;animation:up .5s both}
.paper::before{content:"";position:absolute;top:12px;bottom:12px;inset-inline-start:9px;width:12px;background:radial-gradient(circle,#e3d6c2 3.5px,transparent 4.5px) 0 0/12px 24px}
.paper::after{content:"";position:absolute;top:0;bottom:0;inset-inline-start:28px;width:2px;background:#f7b6d2}
.paper .mut{color:#7a7f9e}.paper .task{border-color:#efe6f7}.paper .task:hover{background:#fdf2f7}
.paper input,.paper select{background:#fff;color:#1e2347;border-color:#e6dcf8}.paper .bar{background:#efe6f7}
.lt{position:relative;margin:10px 0;padding:18px 14px 12px;border-radius:14px;background:#fffdf7;color:#1e2347;box-shadow:0 4px 14px #0000001a;overflow-wrap:anywhere}
.lt::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(135deg,#e8608f 0 10px,#fff 10px 16px,#7fb3e0 16px 26px,#fff 26px 32px)}
.lt small{color:#8a7fa0}
.ticket{display:flex;margin:12px 0;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);animation:up .5s both}
.ticket .stub{flex:none;width:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;background:linear-gradient(160deg,#f07aa4,#d1477a);color:#fff;border-inline-end:3px dashed var(--card);text-align:center}
.ticket .stub b{font:800 28px/1 var(--fd)}.ticket .stub small{font-size:11px}
.ticket .tb{flex:1;min-width:0;padding:12px 14px}.ticket .tb .btn{display:inline-block;margin-top:8px}.ticket .tb h2{margin:0;overflow-wrap:anywhere}
.ticket.past{opacity:.55}.ticket.past .stub{background:#a59bbd}
.dimg{display:block;max-width:100%;border-radius:12px;margin:8px 0}
.pillows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pillow{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:14px;text-align:center;box-shadow:var(--shadow);animation:up .5s both}
.pillow .pav{font-size:38px;line-height:1.15}.pillow .pav svg{width:56px;height:56px;border-radius:50%;background:var(--bl)}
.diary{margin:14px 0;padding:14px 16px;border-radius:8px 20px 20px 8px;background:#fff8ef;color:#1e2347;border-inline-start:8px solid #c98b5b;box-shadow:0 6px 18px #0000001a;animation:up .5s both}
.diary .task{border-color:#f0e2cf;cursor:default}.diary .task:hover{background:none;padding-inline-start:4px}.diary .xp{color:#b0607f}
.bed{margin:12px 0;border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);animation:up .5s both}
.bed .bi{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 0}
.bed .fw{padding:8px 12px 0;font-size:28px;line-height:1.2;min-height:44px}
.bed .soil{height:16px;background:repeating-linear-gradient(90deg,#8b5a3c 0 14px,#7a4d32 14px 22px)}
.room{width:100%;border-radius:18px;display:block;background:var(--card)}
.tail{transform-origin:236px 168px;animation:wag 2s ease-in-out infinite}@keyframes wag{50%{transform:rotate(16deg)}}
.eye{transform-origin:center;transform-box:fill-box;animation:bl 4s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.catg{animation:br 3s ease-in-out infinite;transform-origin:170px 200px}@keyframes br{50%{transform:scaleY(1.02)}}
.eat .catg{animation:ea .5s 3}.eat .fish{opacity:1;animation:fd 1.4s forwards}
@keyframes ea{50%{transform:translateY(8px) rotate(3deg)}}@keyframes fd{0%{transform:translateY(-70px)}60%{transform:translateY(0)}100%{transform:translateY(0);opacity:0}}
.fish{opacity:0}.bub circle{opacity:0}.wash .bub circle{animation:bu 1.8s ease-in infinite}.sponge{opacity:0}.wash .sponge{opacity:1;animation:sp .5s 4 alternate}
@keyframes bu{0%{opacity:.9;transform:translateY(20px) scale(.5)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}@keyframes sp{to{transform:translate(50px,-10px) rotate(20deg)}}
.z{opacity:0;animation:zz 3s infinite}@keyframes zz{50%{opacity:1;transform:translateY(-8px)}}
.play .catg{animation:pl .6s 3}@keyframes pl{50%{transform:translateY(-16px) rotate(-6deg)}}.play .yarn{animation:yr 1.9s}@keyframes yr{50%{transform:translateX(90px) rotate(360deg)}}
.bf{animation:bfly 9s ease-in-out infinite}@keyframes bfly{25%{transform:translate(120px,-20px)}50%{transform:translate(220px,30px)}75%{transform:translate(90px,10px)}}
.items{display:flex;flex-wrap:wrap;gap:8px}.it{background:var(--bl);border-radius:14px;padding:8px 10px;font-size:13px;text-align:center}.it.lk{opacity:.4;filter:grayscale(1)}.it b{display:block;font-size:24px}
.cyw .card{background:#fffafc;color:#1e2347;border-color:#f6e3ee}.cyw .mut{color:#8a7fa0}.cyw .btn.g{background:#efe6fb;color:#1e2347}.cyw input{background:#fff;color:#1e2347}.cyw .task{border-color:#f3e6f0}.cyw .task:hover{background:#fdf2f7}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cg div{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-size:13px;transition:transform .2s}.cg div:hover{transform:scale(1.12)}

/* ================= game: how well do you know me (daily) ================= */
const dayN=()=>Math.floor(pd(today())/864e5);
const qToday=()=>QZ[dayN()%QZ.length];
const qOf=u=>{const q=D.games.quiz[u];return q&&q.d==today()?q:null};
const qMine=()=>qOf(cur),qTheirs=()=>qOf(other());
function qPick(kind,i){const td=today(),old=D.games.quiz[cur]||{};let q=qMine();if(!q)q=D.games.quiz[cur]={d:td,me:null,gu:null,pts:old.pts||0,last:old.last||""};if(q[kind]!=null)return;q[kind]=i;snd("pop");qScore();save();gDraw()}
// Score my guess once both of us have answered today; each person scores their own guess.
function qScore(){const m=qMine(),p=qTheirs();if(!(m&&p&&m.me!=null&&m.gu!=null&&p.me!=null&&p.gu!=null)||m.last==m.d)return false;m.last=m.d;if(m.gu==p.me){m.pts=(m.pts||0)+1;setTimeout(()=>{conf();snd("fan")},300)}earn("game",2,5);logAct("game",t("gQuiz"));return true}
function quizBody(){const Q=qToday(),m=qMine(),p=qTheirs(),o=other(),opt=(k,sel)=>`<div class="qo">${Q[2].map((a,i)=>`<button onclick="qPick('${k}',${i})" ${sel==i?'class="sel"':""}><b>${a[0]}</b>${L3(a)}</button>`).join("")}</div>`,A=i=>i==null?"—":Q[2][i][0]+" "+L3(Q[2][i]);
let h=`<div class="row sb"><h2>❓ ${t("gQuiz")}</h2><span class="mut">${t("qPts")}: <b>${(D.games.quiz[cur]||{}).pts||0}</b></span></div><div class="bubble"><b>${t("qToday")}:</b> ${D.lang=="ar"?Q[0]:Q[1]}</div>`;
if(!m||m.me==null)return h+`<p><b>${t("qMe")}</b></p>`+opt("me");
if(m.gu==null)return h+`<p><b>${tp("qGuess")}</b></p>`+opt("gu");
if(!p||p.me==null||p.gu==null)return h+`<div class="qr"><b>${NM[cur].ic}</b><div>${t("qAns")}: <b>${A(m.me)}</b><br>${tp("qGuess")} <b>${A(m.gu)}</b></div></div><p class="mut" style="text-align:center">${tp("qWait")}</p>`;
const r1=m.gu==p.me,r2=p.gu==m.me;
return h+`<div class="qr"><b>${NM[o].ic}</b><div>${t("qAns")} ${nm(o)}: <b>${A(p.me)}</b><br>${NM[cur].ic} ${t("qGu")}: ${A(m.gu)} ${r1?"✅":"❌"}</div></div><div class="qr"><b>${NM[cur].ic}</b><div>${t("qAns")} ${nm(cur)}: <b>${A(m.me)}</b><br>${NM[o].ic} ${t("qGu")}: ${A(p.gu)} ${r2?"✅":"❌"}</div></div><h2 style="text-align:center">${r1&&r2?t("qBoth"):r1||r2?t("qOne"):t("qNone")}</h2>`}

/* ================= house points, warmth & the shop ================= */
// Points are shared: each of you keeps your own earned total (only you write it); furniture is paid from the sum.
// c = what paid today, as a list of keys: a list is replaced on save, while a map would keep yesterday's keys on the server.
const hp=u=>{const H=D.home;let P=H.p[u];if(!P||typeof P!="object")P=H.p[u]={n:0,d:"",c:[],v:[]};P.n=+P.n||0;if(!Array.isArray(P.c))P.c=[];P.v=P.v||[];if(u==cur&&P.d!=today()){P.d=today();P.c=[]}return P};
const cnt=(P,k)=>P.c.filter(x=>x==k).length;
const earned=u=>+((D.home.p[u]||{}).n)||0;
// anything the shop sells: furniture & pets (SHOP), or a paid wallpaper ("w_…") / floor ("f_…")
const itemOf=id=>SHOP.find(x=>x.id==id)||APT.find(x=>x.id==id)||(m=>{if(!m)return null;const x=(m[1]=="w"?WALLS:FLOORS).find(z=>z[0]==m[2]);return x&&x[1]?{id,c:x[1],e:m[1]=="w"?"🖼️":"🟫",ar:x[2],en:x[3],k:m[1]=="w"?"wall":"floor"}:null})(/^([wf])_(.+)$/.exec(id));
const spent=()=>Object.keys(D.home.own||{}).reduce((a,id)=>a+(((D.home.own||{})[id]||{}).free?0:((itemOf(id)||{}).c||0)),0);
const bal=()=>Math.max(0,earned("rawan")+earned("yousef")-spent());
// cap = how many times a day this kind of thing pays
function earn(k,amt,cap){if(!cur)return 0;const P=hp(cur);if(cnt(P,k)>=cap)return 0;P.c.push(k);P.n+=amt;setTimeout(()=>coinFx(amt),120);return amt}
function coinFx(n){const p=document.querySelector(".pts");if(!p)return;p.querySelector("b").textContent=bal();p.classList.remove("bump");void p.offsetWidth;p.classList.add("bump");const r=p.getBoundingClientRect(),s=document.createElement("span");s.className="fx dn";s.textContent="+"+n+" 🪙";s.style.left=(r.left+r.width/2-20)+"px";s.style.top=(r.bottom+2)+"px";document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}
// Coming home: each of you records the days you visit; a day you both visited warms the house.

/* ================= the safe: photos just for the two of you, locked with a password ================= */
// Each photo is encrypted on this phone before it leaves it: a key is made from your shared password (PBKDF2, 150k rounds)
// and the photo is locked with AES-GCM. The password itself is never saved anywhere, so without it nobody can open them.
const HXC="olw-vault-ok";
const isReg=x=>x.k==1||x.once===0;
let HXK=null,HXONCE=true,HXBUSY=false,HXBAD=0,HXUNTIL=0,HXVIEW=null;
const b64=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hxOk=()=>!!(window.crypto&&crypto.subtle&&window.isSecureContext!==false);
async function hxKey(pw,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}

async function hxDec(k,o){return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(o.iv)},k,ub64(o.c)))}
const hxV=()=>{const V=D.home.vault;return V&&V.s&&V.c?V:null};
const hxOpen=()=>{const V=hxV();return!!(V&&HXK&&HXK.v==V.v)};
const hxSeen=(u,id)=>!!(((D.home.hxo||{})[u]||{})[id]);
const hxList=u=>{const V=hxV();return V?((D.home.hx||{})[u]||[]).filter(x=>x&&x.v==V.v):[]};

const hxNew=()=>cur?hxList(other()).filter(x=>!hxSeen(cur,x.id)).length:0;
const hxDate=ts=>new Date(ts).toLocaleDateString(loc0(),{day:"numeric",month:"short"});

HXBUSY=true;render();try{const s=crypto.getRandomValues(new Uint8Array(16)),k=await hxKey(a,s),ck=await hxEnc(k,new TextEncoder().encode(HXC)),v=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
