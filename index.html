<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf5fb">
<title>بيتنا الصغير · Our Little World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ================= tokens ================= */
:root{--bg:#fbf5fb;--bg2:#f3ecfb;--card:#fff;--line:#efe4f3;--tx:#2b2350;--mut:#7b7899;--pk:#f6b3cf;--ac:#e8608f;--lv:#e3d9fa;--bl:#cfe7ff;--plum:#6c4ab6;--gsh:#cbbdf0;
--shadow:0 1px 2px #2b235012,0 10px 28px #6c4ab612;--fd:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;--fb:"Tajawal","Baloo Bhaijaan 2",system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141331;--bg2:#1c1a40;--card:#211f48;--line:#302c60;--tx:#f2f0ff;--mut:#a7a3cf;--pk:#7b3f63;--lv:#3a3470;--bl:#253f63;--gsh:#2a2558;--shadow:0 1px 2px #0004,0 10px 28px #0005}}
:root[data-theme="dark"]{--bg:#141331;--bg2:#1c1a40;--card:#211f48;--line:#302c60;--tx:#f2f0ff;--mut:#a7a3cf;--pk:#7b3f63;--lv:#3a3470;--bl:#253f63;--gsh:#2a2558;--shadow:0 1px 2px #0004,0 10px 28px #0005}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 var(--fb);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s;-webkit-tap-highlight-color:transparent}
#app{position:relative;z-index:1;display:flex;min-height:100vh}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:12px 16px 100px}
h1,h2,h3,.btn,.chip,nav button,.tg,.bdg{font-family:var(--fd)}
h1{font-size:25px;line-height:1.3;margin:2px 0;font-weight:800;background:linear-gradient(90deg,var(--tx),var(--ac),var(--tx));background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 7s linear infinite}
h1 .e{-webkit-text-fill-color:initial}
h2{font-size:17px;margin:0 0 10px;font-weight:700}
.mut{color:var(--mut);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--shadow);animation:up .5s both}
.msg{background:linear-gradient(135deg,var(--pk),var(--lv),var(--pk));background-size:200%;animation:up .5s both,sh 6s linear infinite;border-color:transparent}
.btn{border:0;background:linear-gradient(135deg,#f07aa4,#e0578a);color:#fff;border-radius:14px;padding:9px 16px;cursor:pointer;font-size:15px;font-weight:700;box-shadow:0 4px 0 #c94677,0 8px 16px #e8608f2e;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c94677}
.btn.g{background:var(--lv);color:var(--tx);box-shadow:0 4px 0 var(--gsh)}.btn.g:active{box-shadow:0 1px 0 var(--gsh)}
.big{font-size:18px;padding:14px 26px;border-radius:18px}
.sel{background:linear-gradient(135deg,#f07aa4,#e0578a)!important;color:#fff!important;box-shadow:0 4px 0 #c94677!important}
.x{border:0;background:none;color:var(--ac);font-size:14px;cursor:pointer;padding:4px 6px;flex:none}
input,select,textarea{background:var(--bg);color:var(--tx);border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;font:inherit;font-size:15px;max-width:100%}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px #e8608f22}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sb{justify-content:space-between}
.bar{height:12px;border-radius:9px;background:var(--lv);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#f6b3cf,#e8608f,#f6b3cf);background-size:200%;animation:sh 3s linear infinite;transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.lbl{display:flex;justify-content:space-between;font-size:13px}
.task{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s,padding .2s;animation:up .4s both}
.task:last-child{border:0}.task:hover{background:var(--bg2);padding-inline-start:10px;border-radius:12px}
.task span{flex:1;min-width:0;overflow-wrap:anywhere}
.ck{width:26px;height:26px;border-radius:9px;border:2.5px solid var(--ac);display:grid;place-items:center;font-size:14px;color:#fff;flex:none;transition:.25s}
.done .ck{background:var(--ac);animation:pop .4s}.done span{opacity:.55;text-decoration:line-through}
.xp{font-size:12px;color:var(--ac);font-style:normal;flex:none;font-weight:700}
.bubble{background:var(--lv);border-radius:16px;padding:8px 14px;margin-bottom:8px;text-align:center;font-size:14px;animation:pop2 .4s}
.pulse{animation:pls 2s infinite}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));inset-inline:12px;margin:auto;max-width:380px;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:16px;text-align:center;font-weight:500;opacity:0;transform:translateY(-30px) scale(.9);transition:.35s cubic-bezier(.3,1.5,.5,1);z-index:60;pointer-events:none;box-shadow:0 10px 30px #0003}
#toast.s{opacity:1;transform:none}
.fx{position:fixed;pointer-events:none;z-index:40;font:800 18px var(--fd);color:var(--ac);animation:fl 1.1s forwards}
.cf{position:fixed;top:-30px;z-index:40;pointer-events:none;animation:cf 2.6s linear forwards}
.hr{position:fixed;left:50%;top:50%;z-index:45;pointer-events:none;animation:hr 1.8s forwards}
.fh{position:fixed;bottom:-40px;z-index:0;pointer-events:none;opacity:.14;animation:fu linear infinite}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes sh{to{background-position:-200%}}
@keyframes pop{50%{transform:scale(1.4) rotate(8deg)}}
@keyframes pop2{from{transform:scale(.85);opacity:0}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pls{0%{box-shadow:0 0 0 0 #e8608f55}70%{box-shadow:0 0 0 14px #e8608f00}100%{box-shadow:0 0 0 0 #e8608f00}}
@keyframes fl{to{transform:translateY(-70px) scale(1.4);opacity:0}}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes hr{to{transform:translate(var(--x),-240px) scale(1.6);opacity:0}}
@keyframes fu{to{transform:translateY(-115vh) rotate(50deg)}}
@keyframes fi{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= top bar & nav ================= */
.top{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top:empty{display:none}
.brand{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--tx);cursor:pointer;font:800 18px var(--fd);padding:0}
.tr{display:flex;align-items:center;gap:8px}
.pc{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:20px}
.pc i{position:absolute;bottom:0;inset-inline-end:0;width:11px;height:11px;border-radius:50%;background:#b9b4d6;box-shadow:0 0 0 2px var(--card)}.pc i.on{background:#39c46a}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer}
nav{position:fixed;bottom:0;inset-inline:0;z-index:7;display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px #6c4ab60f}
nav:empty{display:none}
nav button{position:relative;flex:1;min-width:0;border:0;background:none;color:var(--mut);font-size:11px;font-weight:700;padding:6px 1px 4px;border-radius:14px;cursor:pointer;transition:.25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{transition:transform .25s}
nav button:hover .ic,nav button.on .ic{transform:translateY(-2px) scale(1.12)}
nav button.on{background:var(--lv);color:var(--ac)}
nav .dot{position:absolute;top:4px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 2px var(--card)}
@media(min-width:800px){nav{position:sticky;top:0;height:100vh;flex-direction:column;width:190px;padding:20px 10px;border-top:0;border-inline-end:1px solid var(--line);box-shadow:none}nav button{flex:none;flex-direction:row;gap:10px;font-size:14px;padding:10px 12px}nav .dot{top:10px;left:auto;inset-inline-end:10px}main{padding-bottom:40px}}

/* ================= the house ================= */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 4px}
.hwrap{position:relative;max-width:560px;margin-inline:auto!important;border-radius:30px;overflow:hidden;box-shadow:0 2px 4px #2b235014,0 18px 40px #6c4ab624;margin:12px 0;background:#8fd0ff;animation:up .5s both;touch-action:manipulation}
.hzoom{position:relative;transform-origin:0 0;transition:transform .45s cubic-bezier(.65,0,.35,1)}
.hzoom svg{display:block;width:100%;height:auto}
.hov{position:absolute;inset:0;pointer-events:none}
.tg{position:absolute;translate:-50% 0;font-size:11px;font-weight:700;line-height:1.5;color:#2b2350;background:#ffffffe6;padding:1px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px #2b235022}
.tg i{display:inline-block;font-style:normal;background:#e8608f;color:#fff;font-size:10.5px;font-weight:800;line-height:1.45;padding:0 6px;margin-inline-start:4px;border-radius:999px;box-shadow:0 2px 6px #e8608f55;animation:bob 2s ease-in-out infinite}
.hit{fill:transparent;cursor:pointer;transition:fill .2s;outline:none}
.hit:hover{fill:#ffffff3d}.hit:focus-visible{fill:#ffffff3d;stroke:#6c4ab6;stroke-width:4}
.chr{pointer-events:none}.chr .cb{animation:cbob 2.6s ease-in-out infinite}@keyframes cbob{50%{transform:translateY(-1.5px)}}
.lulu{cursor:pointer}.lulu.walk .lbody{animation:lstep .26s ease-in-out infinite alternate}@keyframes lstep{to{transform:translateY(-1.8px)}}
.ltail{transform-box:fill-box;transform-origin:100% 100%;animation:ltw 1.4s ease-in-out infinite}@keyframes ltw{50%{transform:rotate(-16deg)}}
.think{animation:bob 1.8s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.cld{animation:drift 48s linear infinite}.cld2{animation:drift 64s linear infinite;animation-delay:-30s}@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(740px)}}
.tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
.smoke circle{opacity:0;transform-box:fill-box;transform-origin:center;animation:smk 3.2s ease-out infinite}@keyframes smk{0%{opacity:.85;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(18px,-50px) scale(1.9)}}
.bubs circle{animation:bfl 2.2s ease-in-out infinite alternate}@keyframes bfl{to{transform:translateY(-4px)}}
.gift{cursor:pointer;transform-box:fill-box;transform-origin:center bottom;animation:gbob 1.6s ease-in-out infinite}@keyframes gbob{0%,100%{transform:none}50%{transform:translateY(-3px) rotate(-5deg)}}
.flw{transform-box:fill-box;transform-origin:center bottom;animation:sway 3s ease-in-out infinite alternate}@keyframes sway{to{transform:rotate(5deg)}}
.luv{animation:bob 2s ease-in-out infinite}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--tx);cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.chip:active{transform:scale(.95)}.chip.hot{background:linear-gradient(135deg,var(--pk),var(--lv));border-color:transparent}
.hint{text-align:center}

/* ================= room header (zoomed house) ================= */
.rhd{position:relative;width:100%;aspect-ratio:2/1;max-height:300px;border-radius:26px;overflow:hidden;margin:4px 0 14px;box-shadow:0 2px 4px #2b235014,0 16px 34px #6c4ab620;animation:zin .5s cubic-bezier(.2,.8,.2,1) both;background:#8fd0ff}
@keyframes zin{from{transform:scale(1.08);opacity:.2}}
.rhd>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rht{position:absolute;top:12px;inset-inline-start:12px;max-width:72%;background:#ffffffd9;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:16px;padding:6px 14px 8px;color:#2b2350;box-shadow:0 4px 14px #2b235022}
.rht h1{margin:0;font-size:21px;background:none;color:#2b2350;-webkit-text-fill-color:currentColor;animation:none}
.rht p{margin:0;font-size:13px;color:#5e5a80}
.door{position:absolute;bottom:12px;inset-inline-start:12px;display:flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:8px 14px;background:#ffffffe6;color:#2b2350;font:700 14px var(--fd);cursor:pointer;box-shadow:0 4px 0 #0000001f,0 8px 18px #2b235026;transition:transform .15s}
.door:hover{transform:translateY(-2px)}.door:active{transform:translateY(2px)}

/* ================= room objects ================= */
.tv{background:#2a2f5a;border-radius:22px;padding:10px;margin:12px 0;box-shadow:0 8px 0 #1b1f45;animation:up .5s both}
.tv .scr{border-radius:15px;padding:14px;color:#fff;background:linear-gradient(135deg,#3d5a80,#5b4b8a)}
.tv .mut{color:#dfe2fb}.tv .bar{background:#ffffff33}
.tvs{display:flex;justify-content:space-around;margin-top:10px;font-size:12.5px;text-align:center}.tvs b{display:block;font:800 19px var(--fd)}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.sticky{background:#fff3a8;color:#1e2347;border-radius:3px 3px 14px 3px;padding:12px 6px;text-align:center;font-size:12.5px;box-shadow:0 6px 12px #0002;transform:rotate(-2deg);animation:up .5s both}
.sticky:nth-child(2){background:#ffd1e3;transform:rotate(1.5deg)}.sticky:nth-child(3){background:#cfe9ff;transform:rotate(-1deg)}
.sticky b{display:block;font:800 21px var(--fd)}
.paper{position:relative;margin:14px 0;padding:16px 16px 14px;padding-inline-start:38px;border-radius:6px 20px 20px 6px;background:#fffdf6;color:#1e2347;box-shadow:0 6px 18px #0000001f;animation:up .5s both}
.paper::before{content:"";position:absolute;top:12px;bottom:12px;inset-inline-start:9px;width:12px;background:radial-gradient(circle,#e3d6c2 3.5px,transparent 4.5px) 0 0/12px 24px}
.paper::after{content:"";position:absolute;top:0;bottom:0;inset-inline-start:28px;width:2px;background:#f7b6d2}
.paper .mut{color:#7a7f9e}.paper .task{border-color:#efe6f7}.paper .task:hover{background:#fdf2f7}
.paper input,.paper select{background:#fff;color:#1e2347;border-color:#e6dcf8}.paper .bar{background:#efe6f7}
.lt{position:relative;margin:10px 0;padding:18px 14px 12px;border-radius:14px;background:#fffdf7;color:#1e2347;box-shadow:0 4px 14px #0000001a;overflow-wrap:anywhere}
.lt::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(135deg,#e8608f 0 10px,#fff 10px 16px,#7fb3e0 16px 26px,#fff 26px 32px)}
.lt small{color:#8a7fa0}
.ticket{display:flex;margin:12px 0;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);animation:up .5s both}
.ticket .stub{flex:none;width:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;background:linear-gradient(160deg,#f07aa4,#d1477a);color:#fff;border-inline-end:3px dashed var(--card);text-align:center}
.ticket .stub b{font:800 28px/1 var(--fd)}.ticket .stub small{font-size:11px}
.ticket .tb{flex:1;min-width:0;padding:12px 14px}.ticket .tb .btn{display:inline-block;margin-top:8px}.ticket .tb h2{margin:0;overflow-wrap:anywhere}
.ticket.past{opacity:.55}.ticket.past .stub{background:#a59bbd}
.dimg{display:block;max-width:100%;border-radius:12px;margin:8px 0}
.pillows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pillow{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:14px;text-align:center;box-shadow:var(--shadow);animation:up .5s both}
.pillow .pav{font-size:38px;line-height:1.15}
.diary{margin:14px 0;padding:14px 16px;border-radius:8px 20px 20px 8px;background:#fff8ef;color:#1e2347;border-inline-start:8px solid #c98b5b;box-shadow:0 6px 18px #0000001a;animation:up .5s both}
.diary .task{border-color:#f0e2cf;cursor:default}.diary .task:hover{background:none;padding-inline-start:4px}.diary .xp{color:#b0607f}
.bed{margin:12px 0;border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);animation:up .5s both}
.bed .bi{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 0}
.bed .fw{padding:8px 12px 0;font-size:28px;line-height:1.2;min-height:44px}
.bed .soil{height:16px;background:repeating-linear-gradient(90deg,#8b5a3c 0 14px,#7a4d32 14px 22px)}
.room{width:100%;border-radius:18px;display:block;background:var(--card)}
.tail{transform-origin:236px 168px;animation:wag 2s ease-in-out infinite}@keyframes wag{50%{transform:rotate(16deg)}}
.eye{transform-origin:center;transform-box:fill-box;animation:bl 4s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.catg{animation:br 3s ease-in-out infinite;transform-origin:170px 200px}@keyframes br{50%{transform:scaleY(1.02)}}
.eat .catg{animation:ea .5s 3}.eat .fish{opacity:1;animation:fd 1.4s forwards}
@keyframes ea{50%{transform:translateY(8px) rotate(3deg)}}@keyframes fd{0%{transform:translateY(-70px)}60%{transform:translateY(0)}100%{transform:translateY(0);opacity:0}}
.fish{opacity:0}.bub circle{opacity:0}.wash .bub circle{animation:bu 1.8s ease-in infinite}.sponge{opacity:0}.wash .sponge{opacity:1;animation:sp .5s 4 alternate}
@keyframes bu{0%{opacity:.9;transform:translateY(20px) scale(.5)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}@keyframes sp{to{transform:translate(50px,-10px) rotate(20deg)}}
.z{opacity:0;animation:zz 3s infinite}@keyframes zz{50%{opacity:1;transform:translateY(-8px)}}
.play .catg{animation:pl .6s 3}@keyframes pl{50%{transform:translateY(-16px) rotate(-6deg)}}.play .yarn{animation:yr 1.9s}@keyframes yr{50%{transform:translateX(90px) rotate(360deg)}}
.bf{animation:bfly 9s ease-in-out infinite}@keyframes bfly{25%{transform:translate(120px,-20px)}50%{transform:translate(220px,30px)}75%{transform:translate(90px,10px)}}
.items{display:flex;flex-wrap:wrap;gap:8px}.it{background:var(--bl);border-radius:14px;padding:8px 10px;font-size:13px;text-align:center}.it.lk{opacity:.4;filter:grayscale(1)}.it b{display:block;font-size:24px}
.cyw .card{background:#fffafc;color:#1e2347;border-color:#f6e3ee}.cyw .mut{color:#8a7fa0}.cyw .btn.g{background:#efe6fb;color:#1e2347}.cyw input{background:#fff;color:#1e2347}.cyw .task{border-color:#f3e6f0}.cyw .task:hover{background:#fdf2f7}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cg div{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-size:13px;transition:transform .2s}.cg div:hover{transform:scale(1.12)}
.cg .p{background:#e0709f;color:#fff}.cg .r{background:#f7b6d2aa}.cg .c{background:#f7b6d2;box-shadow:0 0 0 2px #e0709f}.cg .t{outline:2px solid #7f6cc9}.cg .h{font-size:11px;color:#8a7fa0}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.tro{background:var(--bg2);border-radius:18px;padding:10px 6px;text-align:center;font-size:12.5px;font-weight:700;line-height:1.35}
.tro b{display:block;font-size:30px;line-height:1.3}.tro small{display:block;color:var(--mut);font-weight:500;font-size:11px;margin-top:2px}
.tro.lk{opacity:.5;filter:grayscale(1)}.tro.nw{animation:pop .6s}

/* ================= games ================= */
.gcard{display:flex;gap:14px;align-items:flex-start}.gcard p{margin:0 0 10px}
.gi{flex:none;width:64px;height:64px;border-radius:20px;background:var(--bl);display:grid;place-items:center;font-size:34px}
#gbox{animation:none}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:12px auto;perspective:900px}
.mc{position:relative;aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}.mc.f{transform:rotateY(180deg)}.mc.m{animation:mpop .5s}@keyframes mpop{50%{transform:rotateY(180deg) scale(1.12)}}
.mc span{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:28px}
.mc .bk{background:linear-gradient(135deg,var(--pk),var(--lv));font-size:20px;box-shadow:0 3px 8px #e8608f33}.mc .fr{background:var(--card);transform:rotateY(180deg);box-shadow:inset 0 0 0 2px var(--lv)}.mc.m .fr{box-shadow:inset 0 0 0 3px #6cc48a}
.pond{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:12px auto;padding:16px;border-radius:30px;background:linear-gradient(#8fd3f5,#4a9fd8)}
.ph{aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(#2f7fb8,#1d5a8c);box-shadow:inset 0 6px 10px #0005;display:grid;place-items:center;font-size:38px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.fi{animation:fpop .25s ease-out}@keyframes fpop{from{transform:translateY(26px) scale(.4);opacity:0}}
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:270px;margin:12px auto}
.xc{aspect-ratio:1;border:0;border-radius:18px;background:var(--bl);font-size:38px;cursor:pointer;transition:transform .15s}.xc:hover{transform:scale(1.05)}.xc.wl{background:var(--ac);animation:pop .5s}
.cb{width:100%;border-collapse:collapse;font-size:14px;text-align:center}.cb td,.cb th{padding:8px 4px;border-bottom:1px solid var(--line)}.cb td:first-child{text-align:start}
.tub{position:relative;height:320px;margin:12px 0;border-radius:26px;overflow:hidden;background:linear-gradient(#e4f5fc,#b8def0);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tub .tcat{position:absolute;bottom:-4px;left:50%;translate:-50% 0;font-size:64px;pointer-events:none}
.tub .suds{position:absolute;bottom:0;left:0;right:0;height:46px;background:radial-gradient(circle at 10% 60%,#fff 20px,transparent 21px),radial-gradient(circle at 30% 70%,#fff 26px,transparent 27px),radial-gradient(circle at 55% 65%,#fff 24px,transparent 25px),radial-gradient(circle at 78% 70%,#fff 28px,transparent 29px),radial-gradient(circle at 95% 60%,#fff 20px,transparent 21px);pointer-events:none}
.bb{position:absolute;bottom:-60px;padding:0;border:2px solid #ffffffcc;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0 12%,#d6f1ff 30%,#9fd3f5aa 70%,#8ec5f0cc);cursor:pointer;animation:rise linear forwards;transition:opacity .18s,scale .18s}
@keyframes rise{to{transform:translateY(-400px)}}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.qo button{border:1.5px solid var(--line);background:var(--bg2);color:var(--tx);border-radius:18px;padding:12px 8px;font:700 15px var(--fd);cursor:pointer;transition:transform .15s,border-color .15s}
.qo button b{display:block;font-size:28px;line-height:1.2}.qo button:hover{border-color:var(--ac);transform:translateY(-2px)}
.qr{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--bg2);margin:8px 0}.qr b{font-size:26px}
.whw{position:relative;width:230px;max-width:78%;margin:14px auto 6px}
.wheel{display:block;width:100%;height:auto;transition:transform 4s cubic-bezier(.15,.7,.12,1);filter:drop-shadow(0 8px 16px #6c4ab633)}
.ptr{position:absolute;top:-8px;left:50%;translate:-50% 0;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid #e8608f;z-index:2;filter:drop-shadow(0 2px 2px #0003)}
.wres{text-align:center;font:800 19px var(--fd);margin:8px 0;animation:pop2 .4s}

/* ================= overlays: letter & gift ================= */
.ov{position:fixed;inset:0;background:#130f2bcc;display:grid;place-items:center;align-content:center;z-index:50;animation:fi .4s;padding:20px}
.env{position:relative;width:270px;height:180px;background:var(--pk);border-radius:8px;animation:bob 3s ease-in-out infinite;cursor:pointer;box-shadow:0 12px 40px #e0709f88}
.env .front{position:absolute;inset:0;background:var(--ac);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:8px;z-index:2;opacity:.92}
.env .flap{position:absolute;inset:0 0 auto 0;height:62%;background:#c95a88;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:3}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:30px;z-index:4;transition:.4s}
.env.open .seal{opacity:0;transform:translate(-50%,-50%) scale(2)}
.env .letter{position:absolute;left:14px;right:14px;top:14px;bottom:8px;background:#fffdf7;color:#1e2347;border-radius:6px;padding:14px;font-size:14px;z-index:1;transition:transform 1s .5s;text-align:center}
.env .letter p{max-height:90px;overflow:auto;margin:6px 0}
.env.open .letter{transform:translateY(-105px) scale(1.12);z-index:5;box-shadow:0 8px 24px #0004}
.tp{color:#fff;margin-top:18px;animation:bob 2s infinite;font-family:var(--fd)}
.gbx{position:relative;width:130px;height:120px;cursor:pointer;animation:bob 2s ease-in-out infinite}
.gbx .bx{position:absolute;bottom:0;left:12px;width:106px;height:76px;border-radius:12px;background:linear-gradient(#f07aa4,#d1477a)}
.gbx .bx::before{content:"";position:absolute;left:47px;top:0;bottom:0;width:12px;background:#ffd45c}
.gbx .lid{position:absolute;top:22px;left:4px;width:122px;height:26px;border-radius:9px;background:#f59ab9;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.gbx .lid::before{content:"";position:absolute;left:55px;top:0;bottom:0;width:12px;background:#ffd45c}
.gbx .lid::after{content:"🎀";position:absolute;left:44px;top:-26px;font-size:30px}
.gov.open .lid{transform:translate(34px,-96px) rotate(32deg)}
.gres{margin-top:18px;max-width:320px;background:#fffdf7;color:#2b2350;border-radius:20px;padding:16px 18px;text-align:center;font:700 17px/1.6 var(--fd);box-shadow:0 12px 40px #0004;transform:scale(.5);opacity:0;transition:.5s .35s cubic-bezier(.3,1.5,.5,1)}
.gov.open .gres{transform:none;opacity:1}

/* ================= front door (login) ================= */
.entry{max-width:390px;margin:2vh auto 0;text-align:center}
.fdoor{position:relative;width:170px;height:232px;margin:8px auto 0;border-radius:85px 85px 8px 8px;background:linear-gradient(#ee7aa5,#c8557f);box-shadow:inset 0 0 0 8px #b14d78,0 14px 30px #e0709f55;animation:up .6s both}
.fdoor::before{content:"";position:absolute;inset:70px 28px 26px;border-radius:10px;box-shadow:inset 0 0 0 4px #b14d78}
.fdoor .wreath{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:38px}
.fdoor .knob{position:absolute;top:132px;inset-inline-end:16px;width:15px;height:15px;border-radius:50%;background:#ffd66b;box-shadow:0 0 0 3px #e9b949}
.fdoor .peek{position:absolute;bottom:-2px;inset-inline-start:-44px;font-size:40px;animation:bob 3s ease-in-out infinite}
.fdoor .mat{position:absolute;bottom:-2px;inset-inline-end:-40px;font-size:30px}
.step{width:230px;height:14px;margin:0 auto 6px;border-radius:4px;background:#d9a066}
.entry .card{text-align:center}.entry input{width:100%}
.av{display:inline-block;width:110px;margin:6px;padding:14px;border-radius:22px;background:var(--bg2);cursor:pointer;font-size:44px;box-shadow:var(--shadow);transition:.25s;animation:bob 3s ease-in-out infinite}
.av:hover{transform:scale(1.08)}.av small{display:block;font:700 14px var(--fd);color:var(--tx)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

const tone=(f,d,st=0,tp="sine",v=.1,f2)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=tp;o.frequency.setValueAtTime(f,t0+st);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+st+d);g.gain.setValueAtTime(0,t0+st);g.gain.linearRampToValueAtTime(v,t0+st+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+st+d);o.connect(g).connect(AC.destination);o.start(t0+st);o.stop(t0+st+d+.03)};

pu("ach",(a,b)=>[...new Set([...a,...b])]);pu("gift",(a,b)=>b.d>a.d||(b.d==a.d&&(b.n||0)>(a.n||0))?b:a);
pu("quiz",(a,b)=>b.d>a.d?b:b.d<a.d?a:{...b,...Object.fromEntries(Object.entries(a).filter(([,v])=>v!=null)),pts:Math.max(a.pts||0,b.pts||0)});

+`<div class="card"><h2>${t("trophies")} <span class="mut">${have.size}/${ACH.length}</span></h2><div class="shelf">${ACH.map(x=>`<div class="tro ${have.has(x[0])?"":"lk"} ${ACH_NEW.includes(x[0])?"nw":""}"><b>${x[1]}</b>${a?x[2]:x[3]}<small>${a?x[4]:x[5]}</small></div>`).join("")}</div></div>`
+`<div class="card"><h2>${t("settings")}</h2><div class="row"><button class="btn g" onclick="setLang()">🌍 ${t("lang")}</button><button class="btn g" onclick="setTheme()">🎨 ${t("theme")}: ${t("th_"+D.theme)}</button><button class="btn g" onclick="toggleSnd()">${t("sound")}: ${SND?t("sOn"):t("sOff")}</button></div></div>`
+`<div class="card"><h2>🐱 ${t("cname")}</h2><div class="row"><input id="cnm" value="${esc(D.cat.name)}" placeholder="${t("cnph")}" maxlength="20"><button class="btn" onclick="setName()">${t("ad")}</button></div></div>`
+`<div class="card"><div class="row"><button class="btn g" onclick="FB.resetMine()">🔑 ${t("change")}</button><button class="btn" onclick="FB.out()">🚪 ${t("out")}</button></div></div>`}

function gdnView(){const FL=["🌷","🌸","🌼","🌻","🌹","🌺"];
return head("gdn","🌷 "+t("gdn"),t("sGdn"))
+[cur,other()].map(u=>{const s=D.u[u].streak||0,b=Math.max(s,D.games.best[u]||0);return`<div class="bed"><div class="bi"><b>${NM[u].ic} ${nm(u)}</b><span>🔥 ${s} ${t("streak")}${b>s?` · 👑 ${b}`:""}</span></div><div class="fw">${s?Array.from({length:Math.min(s,21)},(_,i)=>FL[i%FL.length]).join(""):"🌱"}</div><div class="soil"></div></div>`}).join("")
+`<p class="mut" style="text-align:center">${t("gdnT")}</p>`}

/* ================= front door (login) ================= */
const AS={s:"loading",err:"",taken:[]};
function loginView(){let b;
if(AS.s=="loading")b=`<div style="font-size:40px;animation:bob 1.5s infinite">🔑</div>`;
else if(AS.s=="pick")b=`<p class="mut">${t("who")}</p>`+["rawan","yousef"].filter(k=>!AS.taken.includes(k)).map(k=>`<div class="av" onclick="FB.claim('${k}')">${NM[k].ic}<small>${nm(k)}</small></div>`).join("")+`<p><button class="btn g" onclick="FB.out()">${t("out")}</button></p>`;
else if(AS.s=="denied")b=`<p class="mut">${t("denied")}</p><button class="btn g" onclick="FB.out()">${t("out")}</button>`;
else b=`<p><input id="em" type="email" placeholder="${t("em")}" autocomplete="username"></p><p><input id="pw2" type="password" placeholder="${t("pw")}" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"></p><button class="btn big" onclick="doLogin()">${t("go")}</button>${AS.err?`<p class="mut">${esc(AS.err)}</p>`:""}<p><button class="btn g" onclick="FB.reset(vv('em'))">${t("forgot")}</button></p>`;
return`<div class="entry"><div class="fdoor"><span class="wreath">💐</span><span class="knob"></span><span class="peek">🐱</span><span class="mat">🪴</span></div><div class="step"></div><div class="card"><h1>${t("brand")} <span class="e">🏡</span></h1><p class="mut">${t("welcome")}</p>${b}<p><button class="btn g" onclick="setLang()">${t("lang")}</button></p></div></div>`}
function doLogin(){FB.login(vv("em"),document.getElementById("pw2").value)}

/* ================= render ================= */
const VIEWS={house:houseView,liv:livView,desk:deskView,cat:catView,our:ourView,cyc:cycView,games:gamesView,mail:mailView,gar:garView,att:attView,gdn:gdnView,bath:bathView};
function nav(){const n=[["house","house",t("house")],["desk","tasks",t("tasks")],["cat","cat",cn()],["liv","sofa",t("rLiv"),unseenNudges()||giftReady()],["games","game",t("rGame"),myXoTurn()||!qMine()],["mail","mail",t("rMail")],["gar","car",t("dates")]];
document.getElementById("nav").innerHTML=cur?n.map(x=>`<button class="${D.tab==x[0]?"on":""}" onclick="${x[0]=="games"?"GM=null;":""}go('${x[0]}')" aria-label="${x[2]}">${icon(x[1])}<span>${x[2]}</span>${x[3]?`<i class="dot"></i>`:""}</button>`).join(""):"";
const o=cur&&other();document.getElementById("top").innerHTML=cur?`<button class="brand" onclick="go('house')">${LOGO}${t("brand")}</button><div class="tr"><span class="pc" title="${nm(o)}">${NM[o].ic}<i class="${online(o)?"on":""}"></i></span><button class="ib" onclick="toggleSnd()" aria-label="${t("sound")}">${icon(SND?"snd":"mute",19)}</button></div>`:""}
function render(){apply();nav();const M=document.getElementById("main");if(!cur){M.innerHTML=loginView();return}dayReset();if(D.tab=="cyc"&&cur!="rawan")D.tab="house";M.innerHTML=(VIEWS[D.tab]||houseView)();afterRender()}
function afterRender(){checkAch();ACH_NEW=D.tab=="att"?ACH_NEW:[];if(D.tab=="house"){if(ZF){zoomOut(ZF);ZF=null}clearTimeout(luT);luT=setTimeout(luluTick,2200)}else ZF=null}

const _h=decay();
setInterval(()=>{decay();if(cur&&(D.tab=="cat"||D.u[cur].day!==today())&&!busy)render()},60000);
(()=>{const b=document.createElement("div");for(let i=0;i<6;i++){const e=document.createElement("span");e.className="fh";e.textContent=["💗","✨","🌸","🐾","⭐","💜"][i];e.style.left=(i*16+Math.random()*8)+"%";e.style.animationDuration=(16+Math.random()*12)+"s";e.style.animationDelay=(-Math.random()*20)+"s";e.style.fontSize=(14+Math.random()*10)+"px";b.appendChild(e)}document.body.appendChild(b)})();
window.APP={D,AS,h:_h,render:()=>render(),setCur:v=>{cur=v;dataOk=false},setOk:()=>{dataOk=true},getCur:()=>cur,pct:u=>pctOf(u),toast,t};
setTimeout(()=>{if(AS.s=="loading"&&!window.FB){AS.s="out";AS.err=t("nofb");render()}},8000);
render();
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyA6TDMAxQKwoqUEA22217G9lj_33e7pT9Q",authDomain:"our-little-world-7db49.firebaseapp.com",projectId:"our-little-world-7db49",storageBucket:"our-little-world-7db49.firebasestorage.app",messagingSenderId:"939906219332",appId:"1:939906219332:web:b8066e2fb54b84b400ab11"});
const auth=getAuth(app),db=getFirestore(app),A=window.APP,D=A.D,AS=A.AS;
let lastG="",unsubs=[],timer=null,ready=false,loaded=false,gs=false,gu=false,nS=false,nU=false,fired=false;
const clean=o=>JSON.parse(JSON.stringify(o));
const rc=()=>{const a=document.activeElement;if(!(a&&(a.tagName=="INPUT"||a.tagName=="TEXTAREA"))&&!document.querySelector(".ov"))A.render()};
function stop(){unsubs.forEach(f=>f());unsubs=[];lastG="";ready=false;loaded=false;gs=gu=nS=nU=fired=false;A.setCur(null)}
function push(){if(!ready||!gs||!gu)return;clearTimeout(timer);timer=setTimeout(async()=>{const c=A.getCur(),U=D.u[c];if(!c)return;try{
await setDoc(doc(db,"world","shared"),clean({cat:D.cat,msgs:D.msgs,dates:D.dates,nudges:D.nudges,log:D.log,u:{[c]:{xp:U.xp,streak:U.streak,st:U.st||{},mm:U.mm||"done",pct:A.pct(c),seen:U.seen||null}}}),{merge:true});
await setDoc(doc(db,"users",c),clean({tasks:U.tasks,day:U.day||null,lastDone:U.lastDone||null,...(c=="rawan"?{cyc:D.u.rawan.cyc}:{})}),{merge:true})}catch(e){A.toast("⚠️ "+(e.code||e.message))}
// Games go in their own write so a rules rejection can't block the saves above. Only my own per-person
// entries are sent (merge keeps the partner's), plus the shared tic-tac-toe board.
const G=D.games,me=k=>({[c]:(G[k]||{})[c]??null}),g=JSON.stringify({xo:G.xo,mem:me("mem"),fish:me("fish"),bub:me("bub"),quiz:me("quiz"),gift:me("gift"),ach:me("ach"),best:me("best")});
if(g!=lastG)try{await setDoc(doc(db,"world","shared"),{games:JSON.parse(g)},{merge:true});lastG=g}catch(e){console.warn("games sync",e.code||e)}},400)}
function start(who){A.setCur(who);ready=true;
unsubs.push(onSnapshot(doc(db,"world","shared"),s=>{if(s.metadata.hasPendingWrites)return;const d=s.data();gs=true;if(!d){nS=true;fin();return}
if(d.cat)D.cat=Object.assign({name:""},d.cat);D.msgs=d.msgs||[];D.dates=d.dates||[];D.nudges=d.nudges||[];
for(const k in(d.u||{}))if(k!=who||!loaded)Object.assign(D.u[k],d.u[k]);loaded=true;D.log=d.log||[];if(d.games)gMerge(d.games);fin();rc()}));
unsubs.push(onSnapshot(doc(db,"users",who),s=>{if(s.metadata.hasPendingWrites)return;const d=s.data();gu=true;if(!d){nU=true;fin();return}
if(d.tasks)D.u[who].tasks=d.tasks;if(d.day!==undefined)D.u[who].day=d.day;if(d.lastDone)D.u[who].lastDone=d.lastDone;if(d.cyc)D.u.rawan.cyc=Object.assign({log:[]},d.cyc);fin();rc()}))}
function beat(){const c=A.getCur();if(!c||!ready)return;D.u[c].seen=Date.now();push()}
function fin(){if(gs&&gu&&!fired){fired=true;A.setOk();if(nS||nU)push();beat();A.render()}}
setInterval(()=>{if(document.visibilityState=="visible")beat()},300000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible")beat()});
onAuthStateChanged(auth,async u=>{stop();if(!u){AS.s="out";A.render();return}AS.s="loading";A.render();
try{const[r,y]=await Promise.all(["rawan","yousef"].map(k=>getDoc(doc(db,"slots",k))));
const own=r.exists()&&r.data().uid==u.uid?"rawan":y.exists()&&y.data().uid==u.uid?"yousef":null;
if(own){AS.s="ok";D.tab="house";start(own);A.render();if(A.h>3)setTimeout(()=>A.toast("🐱 "+A.t("miss")),900);return}
AS.taken=[r.exists()&&"rawan",y.exists()&&"yousef"].filter(Boolean);AS.s=AS.taken.length==2?"denied":"pick";A.render()}
catch(e){AS.s="out";AS.err=e.code||String(e);A.render()}});
window.FB={push,
async login(e,p){AS.err="";try{await signInWithEmailAndPassword(auth,e,p)}catch(x){AS.err=A.t("badl");A.render()}},
out(){signOut(auth)},
async reset(e){if(!e){A.toast(A.t("remail"));return}try{await sendPasswordResetEmail(auth,e)}catch(x){}A.toast(A.t("rsent"))},
async resetMine(){try{await sendPasswordResetEmail(auth,auth.currentUser.email);A.toast(A.t("rsent"))}catch(x){A.toast("⚠️ "+x.code)}},
async claim(k){try{await setDoc(doc(db,"slots",k),{uid:auth.currentUser.uid});AS.s="ok";D.tab="house";start(k);A.render()}catch(x){A.toast("⚠️ "+(x.code||x.message))}}};
</script>
