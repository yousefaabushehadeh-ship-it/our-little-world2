<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Little World 🏡</title>
<style>
/* ===== theme ===== */
:root{--bg:#fdf6fa;--card:#fff;--tx:#1e2347;--mut:#7a7f9e;--pk:#f7b6d2;--bl:#bfe0f5;--lv:#d9ccf5;--ac:#e0709f;--ink:#1e2347}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142b;--card:#1d2040;--tx:#f0f0fa;--mut:#9da2c8;--pk:#6b3a54;--bl:#2c4a63;--lv:#3d3566}}
:root[data-theme="dark"]{--bg:#12142b;--card:#1d2040;--tx:#f0f0fa;--mut:#9da2c8;--pk:#6b3a54;--bl:#2c4a63;--lv:#3d3566}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
#app{position:relative;z-index:1;display:flex;min-height:100vh}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 96px}

/* ===== hallway (nav) ===== */
nav{position:fixed;bottom:0;inset-inline:0;z-index:5;display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);box-shadow:0 -4px 16px #0001}
nav button{position:relative;flex:1;min-width:0;border:0;background:none;color:var(--mut);font:inherit;font-size:10.5px;padding:6px 1px;border-radius:12px;cursor:pointer;transition:.25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button b{display:block;font-size:20px;font-weight:400;transition:transform .25s}
nav button:hover b,nav button.on b{transform:translateY(-3px) scale(1.15)}
nav button.on{background:var(--lv);color:var(--tx)}
nav .dot{position:absolute;top:5px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 2px var(--card)}
@media(min-width:800px){nav{position:sticky;top:0;height:100vh;flex-direction:column;width:180px;padding:20px 10px;box-shadow:2px 0 16px #0001}nav button{flex:none;display:flex;gap:10px;align-items:center;text-align:start;font-size:14px;padding:10px 12px}nav button b{display:inline;font-size:18px}nav .dot{top:8px;left:auto;inset-inline-end:10px}main{padding-bottom:30px}}

/* ===== basics ===== */
h1{font-size:22px;margin:4px 0;background:linear-gradient(90deg,var(--tx),var(--ac),var(--tx));background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 6s linear infinite}
h2{font-size:16px;margin:0 0 10px}
.mut{color:var(--mut);font-size:13px}
h1 .e{-webkit-text-fill-color:initial}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #e0709f14;animation:up .55s both}
.msg{background:linear-gradient(135deg,var(--pk),var(--lv),var(--pk));background-size:200%;animation:up .55s both,sh 5s linear infinite}
.btn{border:0;background:var(--ac);color:#fff;border-radius:12px;padding:9px 14px;cursor:pointer;font:inherit;font-size:14px;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px #e0709f44}.btn:active{transform:scale(.93)}
.btn.g{background:var(--lv);color:var(--tx)}
.big{font-size:18px;padding:16px 26px;border-radius:18px;animation:pls 2s infinite}
.sel{background:var(--ac)!important;color:#fff!important;animation:pop .4s}
.x{border:0;background:none;color:var(--ac);font-size:14px;cursor:pointer;padding:4px 6px;flex:none}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--lv);border-radius:10px;padding:8px;font:inherit;font-size:14px;max-width:100%}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pk)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sb{justify-content:space-between}
.bar{height:12px;border-radius:9px;background:var(--lv);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pk),var(--ac),var(--pk));background-size:200%;animation:sh 3s linear infinite;transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.lbl{display:flex;justify-content:space-between;font-size:13px}
.task{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--lv);cursor:pointer;transition:background .2s,padding .2s;animation:up .45s both}
.task:last-child{border:0}.task:hover{background:var(--bg);padding-inline-start:10px;border-radius:10px}
.task span{flex:1;min-width:0;overflow-wrap:anywhere}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--ac);display:grid;place-items:center;font-size:14px;color:#fff;flex:none;transition:.25s}
.task:hover .ck{transform:rotate(-10deg) scale(1.15)}
.done .ck{background:var(--ac);animation:pop .4s}.done span{opacity:.55;text-decoration:line-through}
.xp{font-size:12px;color:var(--ac);font-style:normal;flex:none}
.bubble{background:var(--lv);border-radius:16px;padding:8px 14px;margin-bottom:8px;text-align:center;font-size:14px;animation:pop2 .4s}
.pulse{animation:pls 2s infinite}
.wave{display:inline-block;animation:wv 2.2s infinite;transform-origin:70% 70%}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:12px;margin:auto;max-width:360px;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:14px;text-align:center;opacity:0;transform:translateY(-30px) scale(.9);transition:.35s cubic-bezier(.3,1.5,.5,1);z-index:50;pointer-events:none}
#toast.s{opacity:1;transform:none}
.fx{position:fixed;pointer-events:none;z-index:20;font-weight:700;color:var(--ac);animation:fl 1.1s forwards}
.cf{position:fixed;top:-30px;z-index:20;pointer-events:none;animation:cf 2.6s linear forwards}
.hr{position:fixed;left:50%;top:50%;z-index:40;pointer-events:none;animation:hr 1.8s forwards}
.fh{position:fixed;bottom:-40px;z-index:0;pointer-events:none;opacity:.22;animation:fu linear infinite}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@keyframes sh{to{background-position:-200%}}
@keyframes pop{50%{transform:scale(1.5) rotate(10deg)}}
@keyframes pop2{from{transform:scale(.85);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pls{0%{box-shadow:0 0 0 0 #e0709f66}70%{box-shadow:0 0 0 16px #e0709f00}100%{box-shadow:0 0 0 0 #e0709f00}}
@keyframes wv{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@keyframes fl{to{transform:translateY(-70px) scale(1.4);opacity:0}}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes hr{to{transform:translate(var(--x),-240px) scale(1.6);opacity:0}}
@keyframes fu{to{transform:translateY(-115vh) rotate(50deg)}}
@keyframes fi{from{opacity:0}}

/* ===== love letter envelope ===== */
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;align-content:center;z-index:30;animation:fi .4s}
.env{position:relative;width:270px;height:180px;background:var(--pk);border-radius:8px;animation:bob 3s ease-in-out infinite;cursor:pointer;box-shadow:0 12px 40px #e0709f88}
.env .front{position:absolute;inset:0;background:var(--ac);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:8px;z-index:2;opacity:.92}
.env .flap{position:absolute;inset:0 0 auto 0;height:62%;background:#c95a88;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:3}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:30px;z-index:4;transition:.4s}
.env.open .seal{opacity:0;transform:translate(-50%,-50%) scale(2)}
.env .letter{position:absolute;left:14px;right:14px;top:14px;bottom:8px;background:#fffdf7;color:#1e2347;border-radius:6px;padding:14px;font-size:14px;z-index:1;transition:transform 1s .5s;text-align:center}
.env .letter p{max-height:90px;overflow:auto;margin:6px 0}
.env.open .letter{transform:translateY(-105px) scale(1.12);z-index:5;box-shadow:0 8px 24px #0004}
.tp{color:#fff;margin-top:18px;animation:bob 2s infinite}

/* ===== room scene header ===== */
.rh{position:relative;overflow:hidden;min-height:176px;margin:2px 0 14px;padding:16px 16px 30px;border-radius:24px;background:var(--wall);color:var(--ink);box-shadow:inset 0 -22px 0 var(--floor);animation:up .45s both}
.rh::before{content:"";position:absolute;inset:0 0 22px;background:radial-gradient(#ffffff8c 1.5px,transparent 2.5px) 0 0/20px 20px;pointer-events:none}
.rh .rt{position:relative;padding-inline-end:86px}
.rh h1{margin:0;font-size:22px;background:none;color:var(--ink);-webkit-text-fill-color:currentColor;animation:none}
.rh .rs{margin:4px 0 0;font-size:13px;opacity:.75}
.win{position:absolute;top:14px;inset-inline-end:16px;width:64px;height:54px;border:4px solid #fff;border-radius:10px;background:linear-gradient(#bfe6fb,#eef8ff);box-shadow:0 3px 0 #0001;display:grid;place-items:center;font-size:20px;overflow:hidden}
.win::before,.win::after{content:"";position:absolute;background:#fff}
.win::before{width:3px;top:0;bottom:0;left:calc(50% - 1.5px)}.win::after{height:3px;left:0;right:0;top:calc(50% - 1.5px)}
.night .win{background:linear-gradient(#181c45,#3d3566)}
.night .rh{box-shadow:inset 0 -22px 0 var(--floor),inset 0 0 60px #ffd76a55}
.dc{position:absolute;bottom:16px;line-height:1;pointer-events:none}
.door{position:absolute;bottom:22px;inset-inline-start:16px;z-index:2;width:50px;height:68px;border:0;border-radius:12px 12px 0 0;background:#c27c45;box-shadow:inset 0 0 0 4px #9a5f2e;color:#fff;font:inherit;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;padding-top:7px;gap:1px;cursor:pointer;transition:transform .2s}
.door::after{content:"";position:absolute;top:38px;inset-inline-end:8px;width:7px;height:7px;border-radius:50%;background:#ffd66b}
.door span{font-size:18px}.door:hover{transform:translateY(-3px)}.door:active{transform:scale(.94)}
.door:focus-visible{outline:3px solid #7f6cc9;outline-offset:2px}

/* ===== room objects ===== */
.tv{background:#2a2f5a;border-radius:20px;padding:10px;margin:12px 0;box-shadow:0 8px 0 #1b1f45;animation:up .55s both}
.tv .scr{border-radius:14px;padding:14px;color:#fff;background:linear-gradient(135deg,#3d5a80,#5b4b8a)}
.tv .mut{color:#dfe2fb}.tv .bar{background:#ffffff33}
.tvs{display:flex;justify-content:space-around;margin-top:10px;font-size:12.5px;text-align:center}.tvs b{display:block;font-size:18px}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.sticky{background:#fff3a8;color:#1e2347;border-radius:3px 3px 14px 3px;padding:12px 6px;text-align:center;font-size:12.5px;box-shadow:0 6px 12px #0002;transform:rotate(-2deg);animation:up .5s both}
.sticky:nth-child(2){background:#ffd1e3;transform:rotate(1.5deg)}.sticky:nth-child(3){background:#cfe9ff;transform:rotate(-1deg)}
.sticky b{display:block;font-size:20px}
.paper{position:relative;margin:14px 0;padding:16px 16px 14px;padding-inline-start:38px;border-radius:6px 18px 18px 6px;background:#fffdf6;color:#1e2347;box-shadow:0 6px 18px #0000001f;animation:up .55s both}
.paper::before{content:"";position:absolute;top:12px;bottom:12px;inset-inline-start:9px;width:12px;background:radial-gradient(circle,#e3d6c2 3.5px,transparent 4.5px) 0 0/12px 24px}
.paper::after{content:"";position:absolute;top:0;bottom:0;inset-inline-start:28px;width:2px;background:#f7b6d2}
.paper .mut{color:#7a7f9e}.paper .task{border-color:#efe6f7}.paper .task:hover{background:#fdf2f7}
.paper input,.paper select{background:#fff;color:#1e2347;border-color:#e6dcf8}.paper .btn.g{background:#ece5fb;color:#1e2347}.paper .bar{background:#efe6f7}
.lt{position:relative;margin:10px 0;padding:18px 14px 12px;border-radius:12px;background:#fffdf7;color:#1e2347;box-shadow:0 4px 14px #0000001a;overflow-wrap:anywhere}
.lt::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:12px 12px 0 0;background:repeating-linear-gradient(135deg,#e0709f 0 10px,#fff 10px 16px,#7fb3e0 16px 26px,#fff 26px 32px)}
.lt small{color:#8a7fa0}
.ticket{display:flex;margin:12px 0;border-radius:16px;overflow:hidden;background:var(--card);box-shadow:0 4px 18px #e0709f1a;animation:up .5s both}
.ticket .stub{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;background:var(--ac);color:#fff;border-inline-end:3px dashed var(--card);text-align:center}
.ticket .stub b{font-size:26px;line-height:1}.ticket .stub small{font-size:11px}
.ticket .tb{flex:1;min-width:0;padding:12px 14px}.ticket .tb .btn{display:inline-block;margin-top:8px}.ticket .tb h2{margin:0;overflow-wrap:anywhere}
.ticket.past{opacity:.55}.ticket.past .stub{background:#a59bbd}
.dimg{display:block;max-width:100%;border-radius:12px;margin:8px 0}
.pillows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pillow{background:var(--card);border-radius:30px;padding:14px;text-align:center;box-shadow:0 4px 18px #e0709f1a;animation:up .5s both}
.pillow .pav{font-size:38px;line-height:1.15}
.diary{margin:14px 0;padding:14px 16px;border-radius:8px 18px 18px 8px;background:#fff8ef;color:#1e2347;border-inline-start:8px solid #c98b5b;box-shadow:0 6px 18px #0000001a;animation:up .55s both}
.diary .task{border-color:#f0e2cf;cursor:default}.diary .task:hover{background:none;padding-inline-start:4px}.diary .xp{color:#b0607f}
.bed{margin:12px 0;border-radius:20px;overflow:hidden;background:var(--card);box-shadow:0 4px 18px #e0709f1a;animation:up .5s both}
.bed .bi{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 0}
.bed .flw{padding:8px 12px 0;font-size:28px;line-height:1.2;min-height:44px}
.bed .soil{height:16px;background:repeating-linear-gradient(90deg,#8b5a3c 0 14px,#7a4d32 14px 22px)}
.pres{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:20px;padding:6px 14px;margin:8px 0 0;box-shadow:0 4px 14px #e0709f14;font-size:14px}

/* ===== the house ===== */
.hs{position:relative;overflow:hidden;border-radius:26px;padding:30px 14px 0;margin:12px 0;background:linear-gradient(#bfe6fb,#eef8ff 75%);animation:up .55s both}
.night .hs{background:linear-gradient(#181c45,#3d3566 80%)}
.sun{position:absolute;top:8px;inset-inline-start:14px;font-size:32px;animation:spin 20s linear infinite}.night .sun{animation:bob 4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cl{position:absolute;left:-50px;font-size:30px;animation:drift 26s linear infinite}@keyframes drift{to{transform:translateX(calc(100vw + 60px))}}
.star{position:absolute;color:#fff3b0;font-size:10px;font-style:normal;animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
.hz{position:relative;max-width:460px;margin:0 auto}
.chim{position:absolute;top:14px;right:20%;width:24px;height:50px;background:#9c4f6c;border-radius:3px 3px 0 0}
.chim i{position:absolute;left:4px;top:-10px;width:16px;height:16px;border-radius:50%;background:#fff;opacity:0;filter:blur(1.5px);animation:smk 3s ease-out infinite}
.chim i:nth-child(2){animation-delay:1s}.chim i:nth-child(3){animation-delay:2s}
@keyframes smk{0%{opacity:.85;transform:scale(.6)}100%{opacity:0;transform:translate(14px,-46px) scale(1.8)}}
.roof{position:relative;height:112px;margin:0 -12px -1px;background:repeating-linear-gradient(180deg,#e0709f 0 15px,#c95a88 15px 18px);clip-path:polygon(50% 0,100% 100%,0 100%)}
.att{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:68px;height:58px;padding:0;border:4px solid #fff;border-radius:50% 50% 12px 12px;background:#fff6d6;color:#1e2347;font-size:22px;line-height:1.1;cursor:pointer;transition:background .2s}
.att:hover{background:#fff}.att:active{transform:translateX(-50%) scale(.94)}.att small{display:block;font-size:10px;font-weight:600}.night .att{background:#ffe08a}
.hb{display:grid;gap:7px;padding:7px;background:#f3d2b3;border-radius:0 0 8px 8px}.night .hb{background:#c9a68a}
.fl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:7px}
.rm{position:relative;overflow:hidden;min-height:106px;border:0;border-radius:8px;padding:8px 4px 17px;background:var(--wl);color:#1e2347;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;box-shadow:inset 0 -12px 0 #d9a066;transition:transform .2s,box-shadow .2s}
.rm:hover{transform:translateY(-3px) scale(1.03);box-shadow:inset 0 -12px 0 #d9a066,0 8px 16px #0002}
.rm:active,.yd:active{transform:scale(.94)}
.night .rm{box-shadow:inset 0 -12px 0 #b98450,inset 0 0 28px #ffd76aaa}
.rm:focus-visible,.att:focus-visible,.yd:focus-visible{outline:3px solid #7f6cc9;outline-offset:2px}
.rm .fu{font-size:28px;line-height:1.1}.rm .who{display:block;font-size:15px;letter-spacing:2px}
.rm .nm,.yd small{font-size:12px;font-weight:600;background:#ffffffd9;color:#1e2347;border-radius:8px;padding:1px 7px;white-space:nowrap}
.hs .bd{position:absolute;top:5px;inset-inline-end:5px;background:#e0709f;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:2px 7px;box-shadow:0 2px 6px #0002;animation:bob 2s ease-in-out infinite;white-space:nowrap}
.walk{display:inline-block;animation:walk 7s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateX(-14px)}45%{transform:translateX(14px)}50%{transform:translateX(14px) scaleX(-1)}95%{transform:translateX(-14px) scaleX(-1)}}
.yard{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;margin:0 -14px;padding:18px 10px 12px;background:linear-gradient(#8fd19e,#5fb878)}.night .yard{background:linear-gradient(#3f7f5a,#2b5a40)}
.yd{position:relative;border:0;background:none;padding:4px;border-radius:12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .2s}
.yd:hover{transform:translateY(-3px)}.yd b{font-size:30px;font-weight:400;line-height:1}.yd .bd{top:-8px}
.gdn b{font-size:17px;letter-spacing:-3px}.tree{font-size:34px;line-height:1}
.gar b{position:relative;background:#e6c39f;border-radius:4px;padding:6px 8px 2px}
.gar b::before{content:"";position:absolute;left:-6px;right:-6px;top:-13px;height:14px;background:#c95a88;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}

/* ===== Lulu's room (svg) ===== */
.room{width:100%;border-radius:18px;display:block;background:var(--card)}
.tail{transform-origin:236px 168px;animation:wag 2s ease-in-out infinite}@keyframes wag{50%{transform:rotate(16deg)}}
.eye{transform-origin:center;transform-box:fill-box;animation:bl 4s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.catg{animation:br 3s ease-in-out infinite;transform-origin:170px 200px}@keyframes br{50%{transform:scaleY(1.02)}}
.eat .catg{animation:ea .5s 3}.eat .fish{opacity:1;animation:fd 1.4s forwards}
@keyframes ea{50%{transform:translateY(8px) rotate(3deg)}}@keyframes fd{0%{transform:translateY(-70px)}60%{transform:translateY(0)}100%{transform:translateY(0);opacity:0}}
.fish{opacity:0}.bub circle{opacity:0}.wash .bub circle{animation:bu 1.8s ease-in infinite}.sponge{opacity:0}.wash .sponge{opacity:1;animation:sp .5s 4 alternate}
@keyframes bu{0%{opacity:.9;transform:translateY(20px) scale(.5)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}@keyframes sp{to{transform:translate(50px,-10px) rotate(20deg)}}
.z{opacity:0;animation:zz 3s infinite}@keyframes zz{50%{opacity:1;transform:translateY(-8px)}}
.play .catg{animation:pl .6s 3}@keyframes pl{50%{transform:translateY(-16px) rotate(-6deg)}}.play .yarn{animation:yr 1.9s}@keyframes yr{50%{transform:translateX(90px) rotate(360deg)}}
.bf{animation:bfly 9s ease-in-out infinite}@keyframes bfly{25%{transform:translate(120px,-20px)}50%{transform:translate(220px,30px)}75%{transform:translate(90px,10px)}}
.items{display:flex;flex-wrap:wrap;gap:8px}.it{background:var(--bl);border-radius:12px;padding:8px 10px;font-size:13px;text-align:center}.it.lk{opacity:.4;filter:grayscale(1)}.it b{display:block;font-size:24px}

/* ===== calendar ===== */
.cyw .card{background:#fffafc;color:#1e2347}.cyw .mut{color:#8a7fa0}.cyw .btn{background:#e0709f}.cyw .btn.g{background:#e6dcf8;color:#1e2347}.cyw input{background:#fff;color:#1e2347}.cyw .task{border-color:#f3e6f0}.cyw .task:hover{background:#fdf2f7}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cg div{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-size:13px;transition:transform .2s}.cg div:hover{transform:scale(1.12)}
.cg .p{background:#e0709f;color:#fff}.cg .r{background:#f7b6d2aa}.cg .c{background:#f7b6d2;box-shadow:0 0 0 2px #e0709f}.cg .t{outline:2px solid #7f6cc9}.cg .h{font-size:11px;color:#8a7fa0}

/* ===== games ===== */
.gcard{display:flex;gap:14px;align-items:flex-start}.gcard p{margin:0 0 10px}
.gi{flex:none;width:64px;height:64px;border-radius:18px;background:var(--bl);display:grid;place-items:center;font-size:34px}
#gbox{animation:none}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:12px auto;perspective:900px}
.mc{position:relative;aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}.mc.f{transform:rotateY(180deg)}.mc.m{animation:mpop .5s}@keyframes mpop{50%{transform:rotateY(180deg) scale(1.12)}}
.mc span{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:28px}
.mc .bk{background:linear-gradient(135deg,var(--pk),var(--lv));font-size:20px;box-shadow:0 3px 8px #e0709f33}.mc .fr{background:var(--card);transform:rotateY(180deg);box-shadow:inset 0 0 0 2px var(--lv)}.mc.m .fr{box-shadow:inset 0 0 0 3px #6cc48a}
.pond{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:12px auto;padding:16px;border-radius:30px;background:linear-gradient(#8fd3f5,#4a9fd8)}
.ph{aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(#2f7fb8,#1d5a8c);box-shadow:inset 0 6px 10px #0005;display:grid;place-items:center;font-size:38px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.fi{animation:fpop .25s ease-out}@keyframes fpop{from{transform:translateY(26px) scale(.4);opacity:0}}
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:270px;margin:12px auto}
.xc{aspect-ratio:1;border:0;border-radius:18px;background:var(--bl);font-size:38px;cursor:pointer;transition:transform .15s}.xc:hover{transform:scale(1.05)}.xc.wl{background:var(--ac);animation:pop .5s}
.cb{width:100%;border-collapse:collapse;font-size:14px;text-align:center}.cb td,.cb th{padding:8px 4px;border-bottom:1px solid var(--lv)}.cb td:first-child{text-align:start}

/* ===== front door (login) ===== */
.entry{max-width:380px;margin:3vh auto 0;text-align:center}
.fdoor{position:relative;width:170px;height:232px;margin:8px auto 0;border-radius:85px 85px 8px 8px;background:linear-gradient(#e0709f,#c95a88);box-shadow:inset 0 0 0 8px #b14d78,0 14px 30px #e0709f55;animation:up .6s both}
.fdoor::before{content:"";position:absolute;inset:70px 28px 26px;border-radius:10px;box-shadow:inset 0 0 0 4px #b14d78}
.fdoor .wreath{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:38px}
.fdoor .knob{position:absolute;top:132px;inset-inline-end:16px;width:15px;height:15px;border-radius:50%;background:#ffd66b;box-shadow:0 0 0 3px #e9b949}
.fdoor .peek{position:absolute;bottom:-2px;inset-inline-start:-44px;font-size:40px;animation:bob 3s ease-in-out infinite}
.fdoor .mat{position:absolute;bottom:-2px;inset-inline-end:-40px;font-size:30px}
.step{width:230px;height:14px;margin:0 auto 6px;border-radius:4px;background:#d9a066}
.entry .card{text-align:center}.entry input{width:100%}
.av{display:inline-block;width:110px;margin:6px;padding:14px;border-radius:20px;background:var(--bg);cursor:pointer;font-size:44px;box-shadow:0 4px 18px #e0709f22;transition:.25s;animation:bob 3s ease-in-out infinite}
.av:hover{transform:scale(1.1) rotate(-3deg)}.av small{display:block;font-size:14px;color:var(--tx)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

if(k.done){logAct("task",k[D.lang]);fx(ev,"+"+k.xp+" ⭐");toast("⭐ +"+k.xp+" XP · 🐱 +"+c);if(lvl(D.cat.xp)>before)setTimeout(()=>{toast("🐱 "+t("up")+lvl(D.cat.xp));conf()},1500);

function nudgeCards(){return D.nudges.map((n,i)=>[n,i]).filter(a=>a[0].to==cur&&!a[0].seen).map(([n,i])=>n.k=="hug"
?`<div class="card msg pulse"><h2>🔔 🤗 ${nm(n.from)}: 💗</h2><p class="mut">${fmtT(n.ts)}</p><button class="btn" onclick="seen(${i})">💗</button></div>`
:`<div class="card msg pulse"><h2>🔔 🚗 ${nm(n.from)}: ${t("wantout")}</h2><p class="mut">${fmtT(n.ts)}</p><div class="row"><button class="btn" onclick="rp(${i},'yes')">${t("yes")}</button><button class="btn g" onclick="rp(${i},'later')">${t("later")}</button></div></div>`).join("")}
function pickImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);dImg=c.toDataURL("image/jpeg",.6);const p=document.getElementById("dp");p.src=dImg;p.style.display="block"};im.src=r.result};r.readAsDataURL(f)}

function pred(){const C=D.u.rawan.cyc,st=C.log.map(x=>x.s).sort();if(!st.length)return null;const ds=[];for(let i=1;i<st.length;i++)ds.push((pd(st[i])-pd(st[i-1]))/864e5);const avg=ds.length?Math.round(ds.reduce((a,b)=>a+b)/ds.length):(+C.len||28),sd=ds.length>1?Math.sqrt(ds.reduce((a,b)=>a+(b-avg)**2,0)/ds.length):0;return{avg,m:Math.max(2,Math.ceil(sd)),nx:addD(st[st.length-1],avg)}}

function gMerge(r){const L=D.games;if(!r)return;["mem","fish"].forEach(k=>{for(const u in r[k]||{}){const a=L[k][u],b=r[k][u];L[k][u]=a==null?b:b==null?a:k=="mem"?Math.min(a,b):Math.max(a,b)}});
const x=r.xo,y=L.xo;if(x&&x.b&&((x.g||0)>(y.g||0)||((x.g||0)==(y.g||0)&&(x.n||0)>=(y.n||0)))){const my=cur&&!x.w&&x.n>0&&x.t==cur&&!(y.t==cur&&!y.w&&y.g==x.g);L.xo=Object.assign(G0().xo,x);if(my)setTimeout(()=>toast("🎮 "+t("gXo")+": "+t("yourT")),400)}}

function fishNew(){fishStop();FI={sc:0,tl:20,c:Array(9).fill(null),k:0,run:1,end:0,tm:[]};GM="fish";render();FI.tm.push(setInterval(fishSpawn,600),setInterval(()=>{if(!fishOk())return;FI.tl--;if(FI.tl<=0)fishEnd();else fishUI()},1000))}

function fishBody(){const F=FI,h=`<div class="row sb"><h2>🐟 ${t("gFish")}</h2><span class="mut">${t("best")}: ${D.games.fish[cur]??"—"}</span></div>`;

const up=all.filter(a=>a[0].d>=td).sort((a,b)=>a[0].d.localeCompare(b[0].d)),past=all.filter(a=>a[0].d<td).sort((a,b)=>b[0].d.localeCompare(a[0].d));
const tk=([x,i])=>{const d=pd(x.d);return`<div class="ticket ${x.d<td?"past":""}"><div class="stub"><b>${d.getDate()}</b><small>${d.toLocaleDateString(loc,{month:"short"})}</small><small>${d.toLocaleDateString(loc,{weekday:"short"})}</small></div><div class="tb"><div class="row sb" style="flex-wrap:nowrap"><h2>🎟️ ${esc(x.ti)}</h2><button class="x" onclick="delDate(${i})" aria-label="✕">✕</button></div>${x.img?`<img class="dimg" src="${x.img}" alt="">`:""}${x.l?`<a class="btn g" href="${esc(x.l)}" target="_blank" rel="noopener noreferrer">🔗 ${t("open")}</a>`:""}<p class="mut">${NM[x.from].ic} ${nm(x.from)}${x.ts?" · "+fmtT(x.ts):""}</p></div></div>`};
return scene("🚗 "+t("rGar"),t("sGar"),"#eadbc8","#a3a3a3",[["🚗","inset-inline-end:60px;font-size:58px"],["🛞","inset-inline-end:16px;font-size:26px"],["🎈","inset-inline-end:140px;bottom:96px;font-size:26px"],["🔧","inset-inline-end:160px;font-size:22px"]])
+`<div class="card msg" style="text-align:center"><button class="btn big" onclick="nudge()">${t("goout")}</button><p class="mut">${t("goouth")} ${nm(o)}${last?" · "+fmtT(last.ts)+" · "+(last.reply=="yes"?t("yes"):last.reply=="later"?t("later"):"⏳"):""}</p></div>`
+(up.concat(past).map(tk).join("")||`<p class="mut" style="text-align:center">${t("nodates")}</p>`)
+`<div class="card"><h2>📝 ${t("planT")}</h2><div class="row"><label>${t("dwhen")} <input id="dd" type="date"></label><input id="dt" placeholder="${t("dwhat")}" maxlength="80" style="flex:1;min-width:140px"></div><p><input id="dl" placeholder="${t("dlink")}" style="width:100%"></p><p class="mut">${t("dimg")} <input type="file" accept="image/*" onchange="pickImg(this)"></p><img id="dp" alt="" style="display:none;max-width:100%;max-height:160px;border-radius:12px;margin-bottom:8px"><button class="btn" onclick="addDate()">${t("ad")}</button></div>`}

function attView(){return scene("⚙️ "+t("rAtt"),t("sAtt"),"#efe2cf","#b98450",[["📦","inset-inline-end:24px;font-size:38px"],["🧳","inset-inline-end:80px;font-size:32px"],["🕯️","inset-inline-end:130px;font-size:24px"],["🕸️","inset-inline-end:110px;bottom:104px;font-size:22px"]])
+`<div class="card"><div class="row"><button class="btn g" onclick="setLang()">🌍 ${t("lang")}</button><button class="btn g" onclick="setTheme()">🎨 ${t("theme")}: ${t("th_"+D.theme)}</button></div></div>`
+`<div class="card"><h2>🐱 ${t("cname")}</h2><div class="row"><input id="cnm" value="${esc(D.cat.name)}" placeholder="${t("cnph")}" maxlength="20"><button class="btn" onclick="setName()">${t("ad")}</button></div></div>`
+`<div class="card"><div class="row"><button class="btn g" onclick="FB.resetMine()">🔑 ${t("change")}</button><button class="btn" onclick="FB.out()">🚪 ${t("out")}</button></div></div>`}

function gdnView(){const FL=["🌷","🌸","🌼","🌻","🌹","🌺"];
return scene("🌷 "+t("gdn"),t("sGdn"),"linear-gradient(#bfe6fb,#eef8ff)","#8fd19e",[["🌳","inset-inline-end:24px;font-size:50px"],["🌻","inset-inline-end:96px;font-size:32px"],["🦋","inset-inline-end:130px;bottom:96px;font-size:22px"],["🐝","inset-inline-end:70px;bottom:110px;font-size:18px"]],1)
+[cur,other()].map(u=>{const s=D.u[u].streak||0;return`<div class="bed"><div class="bi"><b>${NM[u].ic} ${nm(u)}</b><span>🔥 ${s} ${t("streak")}</span></div><div class="flw">${s?Array.from({length:Math.min(s,21)},(_,i)=>FL[i%FL.length]).join(""):"🌱"}</div><div class="soil"></div></div>`}).join("")
+`<p class="mut" style="text-align:center">${t("gdnT")}</p>`}

/* ================= front door (login) ================= */
const AS={s:"loading",err:"",taken:[]};
function loginView(){let b;
if(AS.s=="loading")b=`<div style="font-size:40px;animation:bob 1.5s infinite">🔑</div>`;
else if(AS.s=="pick")b=`<p class="mut">${t("who")}</p>`+["rawan","yousef"].filter(k=>!AS.taken.includes(k)).map(k=>`<div class="av" onclick="FB.claim('${k}')">${NM[k].ic}<small>${nm(k)}</small></div>`).join("")+`<p><button class="btn g" onclick="FB.out()">${t("out")}</button></p>`;
else if(AS.s=="denied")b=`<p class="mut">${t("denied")}</p><button class="btn g" onclick="FB.out()">${t("out")}</button>`;
else b=`<p><input id="em" type="email" placeholder="${t("em")}" autocomplete="username"></p><p><input id="pw2" type="password" placeholder="${t("pw")}" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"></p><button class="btn big" onclick="doLogin()">${t("go")}</button>${AS.err?`<p class="mut">${esc(AS.err)}</p>`:""}<p><button class="btn g" onclick="FB.reset(vv('em'))">${t("forgot")}</button></p>`;
return`<div class="entry"><div class="fdoor"><span class="wreath">💐</span><span class="knob"></span><span class="peek">🐱</span><span class="mat">🪴</span></div><div class="step"></div><div class="card"><h1>Our Little World <span class="e">🏡</span></h1><p class="mut">${t("welcome")}</p>${b}<p><button class="btn g" onclick="setLang()">${t("lang")}</button></p></div></div>`}
function doLogin(){FB.login(vv("em"),document.getElementById("pw2").value)}

/* ================= render ================= */
const VIEWS={house:houseView,liv:livView,desk:deskView,cat:catView,our:ourView,cyc:cycView,games:gamesView,mail:mailView,gar:garView,att:attView,gdn:gdnView};
function nav(){const n=[["house","🏡",t("house")],["desk","✅",t("tasks")],["cat","🐱",cn()],["liv","🛋️",t("rLiv"),unseenNudges()],["games","🎮",t("rGame"),myXoTurn()],["mail","💌",t("rMail")],["gar","🚗",t("dates")]];
document.getElementById("nav").innerHTML=cur?n.map(x=>`<button class="${D.tab==x[0]?"on":""}" onclick="${x[0]=="games"?"GM=null;":""}go('${x[0]}')"><b>${x[1]}</b>${x[2]}${x[3]?`<i class="dot"></i>`:""}</button>`).join(""):""}
function render(){apply();nav();const M=document.getElementById("main");if(!cur){M.innerHTML=loginView();return}dayReset();if(D.tab=="cyc"&&cur!="rawan")D.tab="house";M.innerHTML=(VIEWS[D.tab]||houseView)()}

const _h=decay();
setInterval(()=>{decay();if(cur&&(D.tab=="cat"||D.u[cur].day!==iso(new Date()))&&!busy)render()},60000);
(()=>{const b=document.createElement("div");for(let i=0;i<10;i++){const e=document.createElement("span");e.className="fh";e.textContent=["💗","✨","🌸","🐾","⭐"][i%5];e.style.left=(i*10+Math.random()*8)+"%";e.style.animationDuration=(14+Math.random()*12)+"s";e.style.animationDelay=(-Math.random()*20)+"s";e.style.fontSize=(14+Math.random()*12)+"px";b.appendChild(e)}document.body.appendChild(b)})();
window.APP={D,AS,h:_h,render:()=>render(),setCur:v=>{cur=v},getCur:()=>cur,pct:u=>pctOf(u),toast,t};
setTimeout(()=>{if(AS.s=="loading"&&!window.FB){AS.s="out";AS.err=t("nofb");render()}},8000);
render();
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyA6TDMAxQKwoqUEA22217G9lj_33e7pT9Q",authDomain:"our-little-world-7db49.firebaseapp.com",projectId:"our-little-world-7db49",storageBucket:"our-little-world-7db49.firebasestorage.app",messagingSenderId:"939906219332",appId:"1:939906219332:web:b8066e2fb54b84b400ab11"});
const auth=getAuth(app),db=getFirestore(app),A=window.APP,D=A.D,AS=A.AS;
let lastG="",unsubs=[],timer=null,ready=false,loaded=false,gs=false,gu=false,nS=false,nU=false,fired=false;
const clean=o=>JSON.parse(JSON.stringify(o));
const rc=()=>{const a=document.activeElement;if(!(a&&(a.tagName=="INPUT"||a.tagName=="TEXTAREA")))A.render()};
function stop(){unsubs.forEach(f=>f());unsubs=[];lastG="";ready=false;loaded=false;gs=gu=nS=nU=fired=false;A.setCur(null)}
function push(){if(!ready||!gs||!gu)return;clearTimeout(timer);timer=setTimeout(async()=>{const c=A.getCur(),U=D.u[c];if(!c)return;try{
await setDoc(doc(db,"world","shared"),clean({cat:D.cat,msgs:D.msgs,dates:D.dates,nudges:D.nudges,log:D.log,u:{[c]:{xp:U.xp,streak:U.streak,st:U.st||{},mm:U.mm||"done",pct:A.pct(c),seen:U.seen||null}}}),{merge:true});
await setDoc(doc(db,"users",c),clean({tasks:U.tasks,day:U.day||null,lastDone:U.lastDone||null,...(c=="rawan"?{cyc:D.u.rawan.cyc}:{})}),{merge:true})}catch(e){A.toast("⚠️ "+(e.code||e.message))}
// games go in their own write so a rules rejection can't block the saves above
const g=JSON.stringify(D.games);if(g!=lastG)try{await setDoc(doc(db,"world","shared"),{games:JSON.parse(g)},{merge:true});lastG=g}catch(e){console.warn("games sync",e.code||e)}},400)}
function start(who){A.setCur(who);ready=true;
unsubs.push(onSnapshot(doc(db,"world","shared"),s=>{if(s.metadata.hasPendingWrites)return;const d=s.data();gs=true;if(!d){nS=true;fin();return}
if(d.cat)D.cat=Object.assign({name:""},d.cat);D.msgs=d.msgs||[];D.dates=d.dates||[];D.nudges=d.nudges||[];
for(const k in(d.u||{}))if(k!=who||!loaded)Object.assign(D.u[k],d.u[k]);loaded=true;D.log=d.log||[];if(d.games){gMerge(d.games);lastG=JSON.stringify(d.games)}fin();rc()}));
unsubs.push(onSnapshot(doc(db,"users",who),s=>{if(s.metadata.hasPendingWrites)return;const d=s.data();gu=true;if(!d){nU=true;fin();return}
if(d.tasks)D.u[who].tasks=d.tasks;if(d.day!==undefined)D.u[who].day=d.day;if(d.lastDone)D.u[who].lastDone=d.lastDone;if(d.cyc)D.u.rawan.cyc=Object.assign({log:[]},d.cyc);fin();rc()}))}
function beat(){const c=A.getCur();if(!c||!ready)return;D.u[c].seen=Date.now();push()}
function fin(){if(gs&&gu&&!fired){fired=true;if(nS||nU)push();beat()}}
setInterval(()=>{if(document.visibilityState=="visible")beat()},300000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible")beat()});
onAuthStateChanged(auth,async u=>{stop();if(!u){AS.s="out";A.render();return}AS.s="loading";A.render();
try{const[r,y]=await Promise.all(["rawan","yousef"].map(k=>getDoc(doc(db,"slots",k))));
const own=r.exists()&&r.data().uid==u.uid?"rawan":y.exists()&&y.data().uid==u.uid?"yousef":null;
if(own){AS.s="ok";D.tab="house";start(own);A.render();if(A.h>3)setTimeout(()=>A.toast("🐱 "+A.t("miss")),900);return}
AS.taken=[r.exists()&&"rawan",y.exists()&&"yousef"].filter(Boolean);AS.s=AS.taken.length==2?"denied":"pick";A.render()}
catch(e){AS.s="out";AS.err=e.code||String(e);A.render()}});
window.FB={push,
async login(e,p){AS.err="";try{await signInWithEmailAndPassword(auth,e,p)}catch(x){AS.err=A.t("badl");A.render()}},
out(){signOut(auth)},
async reset(e){if(!e){A.toast(A.t("remail"));return}try{await sendPasswordResetEmail(auth,e)}catch(x){}A.toast(A.t("rsent"))},
async resetMine(){try{await sendPasswordResetEmail(auth,auth.currentUser.email);A.toast(A.t("rsent"))}catch(x){A.toast("⚠️ "+x.code)}},
async claim(k){try{await setDoc(doc(db,"slots",k),{uid:auth.currentUser.uid});AS.s="ok";D.tab="house";start(k);A.render()}catch(x){A.toast("⚠️ "+(x.code||x.message))}}};
</script>
