<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Little World</title>
<style>
:root{--bg:#fdf6fa;--card:#fff;--tx:#1e2347;--mut:#7a7f9e;--pk:#f7b6d2;--bl:#bfe0f5;--lv:#d9ccf5;--ac:#e0709f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142b;--card:#1d2040;--tx:#f0f0fa;--mut:#9da2c8;--pk:#6b3a54;--bl:#2c4a63;--lv:#3d3566}}
:root[data-theme="dark"]{--bg:#12142b;--card:#1d2040;--tx:#f0f0fa;--mut:#9da2c8;--pk:#6b3a54;--bl:#2c4a63;--lv:#3d3566}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;transition:background .4s,color .4s;overflow-x:hidden}
#app{display:flex;min-height:100vh}
nav{display:flex;gap:4px;position:fixed;bottom:0;inset-inline:0;background:var(--card);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px #0001;z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:11px;padding:6px 2px;border-radius:12px;cursor:pointer;transition:.25s}
nav button b{display:block;font-size:20px;font-weight:400;transition:transform .25s}nav button:hover b,nav button.on b{transform:translateY(-3px) scale(1.15)}nav button.on{background:var(--lv);color:var(--tx)}
main{flex:1;padding:16px 16px 90px;max-width:760px;margin:0 auto;width:100%}
@media(min-width:800px){nav{position:static;flex-direction:column;width:170px;padding:20px 10px;box-shadow:2px 0 16px #0001;height:100vh;position:sticky;top:0}nav button{flex:none;text-align:start;display:flex;gap:10px;align-items:center;font-size:14px;padding:10px 12px}nav button b{display:inline;font-size:18px}main{padding-bottom:30px}}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #e0709f14;animation:up .55s both;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #e0709f26}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.19s}main>*:nth-child(5){animation-delay:.26s}main>*:nth-child(6){animation-delay:.33s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
h1{font-size:22px;margin:4px 0}h2{font-size:16px;margin:0 0 10px}.mut{color:var(--mut);font-size:13px}.wave{display:inline-block;animation:wv 2.2s infinite;transform-origin:70% 70%}@keyframes wv{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.bar{height:12px;border-radius:9px;background:var(--lv);overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pk),var(--ac),var(--pk));background-size:200%;animation:sh 3s linear infinite;transition:width .8s cubic-bezier(.3,1.4,.5,1)}@keyframes sh{to{background-position:-200%}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats div{background:var(--bl);border-radius:14px;padding:10px 4px;font-size:13px;animation:up .6s both;transition:transform .2s}.stats div:hover{transform:scale(1.06) rotate(-1deg)}.stats b{display:block;font-size:18px}
.task{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--lv);cursor:pointer;transition:background .2s,padding .2s}.task:hover{background:var(--bg);padding-inline-start:10px;border-radius:10px}.task:last-child{border:0}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--ac);display:grid;place-items:center;font-size:14px;color:#fff;flex:none;transition:.25s}.done .ck{background:var(--ac);animation:pop .4s}.done span{opacity:.55;text-decoration:line-through}
@keyframes pop{50%{transform:scale(1.5) rotate(10deg)}}
.xp{margin-inline-start:auto;font-size:12px;color:var(--ac)}
.btn{border:0;background:var(--ac);color:#fff;border-radius:12px;padding:9px 14px;cursor:pointer;font-size:14px;transition:transform .15s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px #e0709f44}.btn:active{transform:scale(.93)}.btn.g{background:var(--lv);color:var(--tx)}
input{background:var(--bg);color:var(--tx);border:1px solid var(--lv);border-radius:10px;padding:8px;font-size:14px;max-width:100%}input:focus{outline:2px solid var(--pk)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:12px;margin:auto;max-width:360px;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:14px;text-align:center;opacity:0;transform:translateY(-30px) scale(.9);transition:.35s cubic-bezier(.3,1.5,.5,1);z-index:9;pointer-events:none}#toast.s{opacity:1;transform:none}
.msg{background:linear-gradient(135deg,var(--pk),var(--lv))}
.fx{position:fixed;pointer-events:none;z-index:20;font-weight:700;color:var(--ac);animation:fl 1.1s forwards}@keyframes fl{to{transform:translateY(-70px) scale(1.4);opacity:0}}
.cf{position:fixed;top:-30px;z-index:20;pointer-events:none;animation:cf 2.6s linear forwards}@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
.login{max-width:340px;margin:8vh auto;text-align:center}.av{display:inline-block;width:110px;margin:6px;padding:14px;border-radius:20px;background:var(--card);cursor:pointer;font-size:44px;box-shadow:0 4px 18px #e0709f22;transition:.25s;animation:bob 3s ease-in-out infinite}.av:hover{transform:scale(1.1) rotate(-3deg)}.av small{display:block;font-size:14px;color:var(--tx)}
@keyframes bob{50%{transform:translateY(-6px)}}
.room{width:100%;border-radius:18px;display:block;background:var(--card)}
.tail{transform-origin:236px 168px;animation:wag 2s ease-in-out infinite}@keyframes wag{50%{transform:rotate(16deg)}}
.eye{transform-origin:center;transform-box:fill-box;animation:bl 4s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.catg{animation:br 3s ease-in-out infinite;transform-origin:170px 200px}@keyframes br{50%{transform:scaleY(1.02)}}
.eat .catg{animation:ea .5s 3}.eat .fish{opacity:1;animation:fd 1.4s forwards}@keyframes ea{50%{transform:translateY(8px) rotate(3deg)}}@keyframes fd{0%{transform:translateY(-70px)}60%{transform:translateY(0)}100%{transform:translateY(0);opacity:0}}
.fish{opacity:0}.bub circle{opacity:0}.wash .bub circle{animation:bu 1.8s ease-in infinite}.wash .sponge{opacity:1;animation:sp .5s 4 alternate}.sponge{opacity:0}
@keyframes bu{0%{opacity:.9;transform:translateY(20px) scale(.5)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}@keyframes sp{to{transform:translate(50px,-10px) rotate(20deg)}}
.z{opacity:0;animation:zz 3s infinite}@keyframes zz{50%{opacity:1;transform:translateY(-8px)}}
.lbl{display:flex;justify-content:space-between;font-size:13px}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;align-content:center;z-index:30;animation:fi .4s}@keyframes fi{from{opacity:0}}
.env{position:relative;width:270px;height:180px;background:var(--pk);border-radius:8px;animation:bob 3s ease-in-out infinite;cursor:pointer;box-shadow:0 12px 40px #e0709f88}
.env .front{position:absolute;inset:0;background:var(--ac);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:8px;z-index:2;opacity:.92}
.env .flap{position:absolute;inset:0 0 auto 0;height:62%;background:#c95a88;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:3}
.env.open .flap{transform:rotateX(180deg);z-index:0}.env .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:30px;z-index:4;transition:.4s}.env.open .seal{opacity:0;transform:translate(-50%,-50%) scale(2)}
.letter{position:absolute;left:14px;right:14px;top:14px;bottom:8px;background:#fffdf7;color:#1e2347;border-radius:6px;padding:14px;font-size:14px;z-index:1;transition:transform 1s .5s;text-align:center}
.env.open .letter{transform:translateY(-105px) scale(1.12);z-index:5;box-shadow:0 8px 24px #0004}.tp{color:#fff;margin-top:18px;animation:bob 2s infinite}
.hr{position:fixed;left:50%;top:50%;z-index:40;pointer-events:none;animation:hr 1.8s forwards}@keyframes hr{to{transform:translate(var(--x),-240px) scale(1.6);opacity:0}}
.bubble{background:var(--lv);border-radius:16px;padding:8px 14px;margin-bottom:8px;text-align:center;font-size:14px;animation:pop2 .4s}@keyframes pop2{from{transform:scale(.85);opacity:0}}
.play .catg{animation:pl .6s 3}@keyframes pl{50%{transform:translateY(-16px) rotate(-6deg)}}.play .yarn{animation:yr 1.9s}@keyframes yr{50%{transform:translateX(90px) rotate(360deg)}}
.items{display:flex;flex-wrap:wrap;gap:8px}.it{background:var(--bl);border-radius:12px;padding:8px 10px;font-size:13px;text-align:center}.it.lk{opacity:.4;filter:grayscale(1)}.it b{display:block;font-size:24px}
.cyw{background:linear-gradient(160deg,#fff0f6,#f3e9ff);border-radius:24px;padding:14px;color:#1e2347}.cyw .card{background:#fffafc;color:#1e2347}.cyw .mut{color:#8a7fa0}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cg div{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-size:13px;transition:transform .2s}.cg div:hover{transform:scale(1.12)}
.cg .p{background:#e0709f;color:#fff}.cg .r{background:#f7b6d2aa}.cg .c{background:#f7b6d2;box-shadow:0 0 0 2px #e0709f}.cg .t{outline:2px solid #7f6cc9}.cg .h{font-size:11px;color:#8a7fa0}
.cyw .btn{background:#e0709f}.cyw .btn.g{background:#e6dcf8;color:#1e2347}.cyw input{background:#fff;color:#1e2347}.cyb{background:linear-gradient(90deg,#f7b6d2,#b9a2ef);color:#1e2347;font-weight:600}
textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--lv);border-radius:10px;padding:8px;font:inherit;font-size:14px;resize:vertical}textarea:focus{outline:2px solid var(--pk)}.letter p{max-height:90px;overflow:auto;margin:6px 0}
#app{position:relative;z-index:1}.fh{position:fixed;bottom:-40px;z-index:0;pointer-events:none;opacity:.22;animation:fu linear infinite}@keyframes fu{to{transform:translateY(-115vh) rotate(50deg)}}
h1{background:linear-gradient(90deg,var(--tx),var(--ac),var(--tx));background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 6s linear infinite}
.pulse{animation:pls 2s infinite}@keyframes pls{0%{box-shadow:0 0 0 0 #e0709f66}70%{box-shadow:0 0 0 16px #e0709f00}100%{box-shadow:0 0 0 0 #e0709f00}}
.big{font-size:18px;padding:16px 26px;border-radius:18px;animation:pls 2s infinite}.sel{background:var(--ac)!important;color:#fff!important;animation:pop .4s}
.task{animation:up .45s both}.task:nth-child(2){animation-delay:.05s}.task:nth-child(3){animation-delay:.1s}.task:nth-child(4){animation-delay:.15s}.task:nth-child(5){animation-delay:.2s}.task:nth-child(6){animation-delay:.25s}.task:hover .ck{transform:rotate(-10deg) scale(1.15)}
.bf{animation:bfly 9s ease-in-out infinite}@keyframes bfly{25%{transform:translate(120px,-20px)}50%{transform:translate(220px,30px)}75%{transform:translate(90px,10px)}}
.stats b{animation:bob 3s ease-in-out infinite}nav button:nth-child(odd) b{animation:bob 4s ease-in-out infinite}.msg{background-size:200%;animation:up .55s both,sh 5s linear infinite}
</style>
</head>

en:{home:"Home",tasks:"Tasks",cat:"Cat",day:"Our Day",me:"Settings",gm:"Good Morning",prog:"Today's Progress",streak:"Day Streak",xp:"XP",left:"Tasks left",lvl:"Level",feed:"Feed 🐟",clean:"Clean 🧼",add:"Add task",ph:"New task…",shared:"Shared",done:"🌙 You did it!",soft:"Tomorrow is another chance 🌱 Small progress is still progress ❤️",lang:"العربية",theme:"Theme",cyc:"Private Cycle Tracker (Rawan only)",share:"Share cycle information with partner",last:"Last period start",len:"Cycle length (days)",est:"Estimated",next:"Next expected",disc:"Predictions are approximate and may be inaccurate, especially with irregular cycles.",priv:"🔒 Only Rawan can see this. Nobody else does unless she turns sharing on.",up:"Lulu reached level ",hun:"Fullness",cln:"Clean",hap:"Happy",who:"Who are you?",pw:"Password",setpw:"First time? Choose a password (min 4 chars)",go:"Enter",back:"Back",bad:"Wrong password, try again 💗",out:"Log out",msgFrom:"💌 Message from ",msg:"I'm proud of you today — just trying and continuing is an achievement ❤️",msg2:"You finished your day, I'm proud of you 💪",yum:"Yum! 😻",fresh:"Clean and shiny ✨",demo:"Demo prototype — data is stored only in your browser",change:"Change password"}};
Object.assign(T.ar,{wm:"رسائلي إلى",mph:"اكتب رسالة حب أو تشجيع…",cname:"اسم القطة",cnph:"اسم جديد للقطة",nomsg:"لم تكتب رسائل بعد، سيصله رسالة افتراضية 💗",sent:"💌 تم حفظ الرسالة",play:"العبي معها 🧶",tap:"اضغطي لفتح الظرف 💌",items:"غرفة لولو",stg:"المرحلة",lk:"يفتح عند المستوى",cyT:"تقويمي الخاص 🌸",st:"بداية الدورة",endd:"نهايتها (اختياري)",nt:"ملاحظة (اختياري)",ad:"حفظ",hist:"الدورات السابقة",nod:"لا توجد سجلات بعد",pm:"قد تتقدم أو تتأخر حتى",days:"أيام",avgl:"متوسط طول الدورة",leg:"● الدورة   ◌ الفترة المتوقعة   ◎ الأرجح",bk:"رجوع"});
Object.assign(T.en,{wm:"My messages to",mph:"Write a love or encouragement note…",cname:"Cat name",cnph:"New cat name",nomsg:"No messages yet, a default one will be shown 💗",sent:"💌 Message saved",play:"Play 🧶",tap:"Tap to open the envelope 💌",items:"Lulu's room",stg:"Stage",lk:"Unlocks at level",cyT:"My private calendar 🌸",st:"Period start",endd:"End (optional)",nt:"Note (optional)",ad:"Save",hist:"Past cycles",nod:"No records yet",pm:"May come earlier or later by up to",days:"days",avgl:"Average cycle length",leg:"● Period   ◌ Predicted window   ◎ Most likely",bk:"Back"});
Object.assign(T.ar,{dates:"الديتات",cynav:"دورتي",fun:"المرح",mm:"متى تظهر لي رسائل الشريك؟",mmd:"بعد ما أخلّص مهامي 🌙",mma:"بأي وقت 💌",mystat:"حالتي الآن",care:"أنا معك 🫂 وبيساعد كتير تحكي مع حدا قريب منك أو مختص.",hug:"ابعث حضن 🤗",wantout:"عبالي نطلع! 🚗",yes:"يلا! 🎉",later:"مش هلأ",newn:"عندك إشعار جديد 💗",goout:"عبالي نطلع 🚗",goouth:"بيوصل إشعار لـ",nsent:"وصّلنا الإشعار 💗",planT:"خطّط لديت جديد",dwhen:"التاريخ",dwhat:"الفعالية",dlink:"رابط (اختياري)",dimg:"صورة (اختيارية)",nodates:"ما في ديتات مخططة بعد ✨",open:"فتح الرابط",miss:"لولو اشتاقت لكم 🥺 تعالوا طعموها والعبوا معها"});
Object.assign(T.en,{dates:"Dates",cynav:"Cycle",fun:"Fun",mm:"When do I see my partner's messages?",mmd:"After I finish my tasks 🌙",mma:"Anytime 💌",mystat:"How I am now",care:"I'm here with you 🫂 Talking to someone close, or a professional, can really help.",hug:"Send a hug 🤗",wantout:"I feel like going out! 🚗",yes:"Let's go! 🎉",later:"Not now",newn:"You have a new notification 💗",goout:"I feel like going out 🚗",goouth:"A notification goes to",nsent:"Notification sent 💗",planT:"Plan a new date",dwhen:"Date",dwhat:"Activity",dlink:"Link (optional)",dimg:"Image (optional)",nodates:"No dates planned yet ✨",open:"Open link",miss:"Lulu missed you 🥺 Come feed her and play"});
const STG={ar:["هريرة صغيرة","قطة يافعة","قطة أنيقة","ملكة القطط 👑"],en:["Kitten","Young cat","Stylish cat","Cat royalty 👑"]};
const CL={ar:{hun:["بطني بتزقزق… 🐟","ممكن سمكة صغيرة؟"],dirty:["بدي حمّام فقاعات 🫧","فروي محتاج تنظيف!"],ok:["أنا بحبكم كتير 💗","شفت إنكم أنجزتوا؟ فخورة فيكم!","بدي أنام جنب النافذة ☀️","العبوا معي شوي 🧶"]},en:{hun:["My tummy is rumbling… 🐟","Maybe a little fish?"],dirty:["I'd love a bubble bath 🫧","My fur needs a wash!"],ok:["I love you both 💗","I saw you did great — so proud!","I'll nap by the window ☀️","Play with me a bit 🧶"]}};

const F=[[2,"🛏️",60,225,"سرير","Bed"],[3,"📚",275,120,"مكتبة","Bookshelf"],[4,"🖼️",150,75,"لوحة","Painting"],[5,"🛋️",268,228,"كنبة","Sofa"],[6,"💡",215,62,"مصباح","Lamp"],[7,"🏰",30,120,"قلعة","Castle"]];
const stage=L=>L<3?0:L<5?1:L<7?2:3;
const sc=()=>`translate(170 222) scale(${[.75,.88,1,1.08][stage(lvl(D.cat.xp))]}) translate(-170 -222)`;

function addMsg(){const v=document.getElementById("mt").value.trim().slice(0,400);if(!v)return;D.msgs.push({from:cur,to:other(),text:v});save();render();toast(t("sent"))}

function rp(i,v){D.nudges[i].reply=v;D.nudges[i].seen=true;save();if(v=="yes")conf();render()}
function nudgeCards(){return D.nudges.map((n,i)=>[n,i]).filter(a=>a[0].to==cur&&!a[0].seen).map(a=>{const n=a[0];return n.k=="hug"?`<div class="card msg pulse"><h2>🤗 ${nm(n.from)}: 💗</h2><button class="btn" onclick="seen(${a[1]})">💗</button></div>`:`<div class="card msg pulse"><h2>🚗 ${nm(n.from)}: ${t("wantout")}</h2><div class="row"><button class="btn" onclick="rp(${a[1]},'yes')">${t("yes")}</button><button class="btn g" onclick="rp(${a[1]},'later')">${t("later")}</button></div></div>`}).join("")}
let dImg="";
const vv=id=>document.getElementById(id).value.trim();
function pickImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);dImg=c.toDataURL("image/jpeg",.6);const p=document.getElementById("dp");p.src=dImg;p.style.display="block"};im.src=r.result};r.readAsDataURL(f)}
function addDate(){const d=vv("dd"),ti=vv("dt");if(!d||!ti)return;let l=vv("dl");if(l){if(!/^https?:\/\//i.test(l))l="https://"+l;try{new URL(l)}catch(e){l=""}}D.dates.push({from:cur,d,ti:ti.slice(0,80),l:l.slice(0,300),img:dImg});dImg="";save();hrt();render()}
function delDate(i){D.dates.splice(i,1);save();render()}
function datesView(){const o=other(),loc=D.lang=="ar"?"ar-JO":"en-GB",last=D.nudges.filter(n=>n.from==cur&&n.k=="out").pop();
const list=D.dates.map((x,i)=>[x,i]).sort((a,b)=>a[0].d.localeCompare(b[0].d)).map(a=>{const x=a[0];return`<div class="card"><div class="row" style="justify-content:space-between"><b>🗓️ ${new Date(x.d+"T12:00").toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"long"})}</b><em class="xp" style="cursor:pointer" onclick="delDate(${a[1]})">✕</em></div><h2>${esc(x.ti)}</h2>${x.img?`<img src="${x.img}" alt="" style="max-width:100%;border-radius:14px;margin:6px 0">`:""}${x.l?`<a class="btn g" href="${esc(x.l)}" target="_blank" rel="noopener noreferrer">🔗 ${t("open")}</a>`:""}<p class="mut">${NM[x.from].ic} ${nm(x.from)}</p></div>`}).join("");
return`<h1>${t("dates")} 🗓️</h1><div class="card msg" style="text-align:center"><button class="btn big" onclick="nudge()">${t("goout")}</button><p class="mut">${t("goouth")} ${nm(o)}${last?" · "+(last.reply=="yes"?t("yes"):last.reply=="later"?t("later"):"⏳"):""}</p></div>
<div class="card"><h2>${t("planT")}</h2><div class="row"><label>${t("dwhen")} <input id="dd" type="date"></label><input id="dt" placeholder="${t("dwhat")}" maxlength="80"></div><p><input id="dl" placeholder="${t("dlink")}" style="width:100%"></p><p class="mut">${t("dimg")} <input type="file" accept="image/*" onchange="pickImg(this)"></p><img id="dp" alt="" style="display:none;max-width:100%;max-height:160px;border-radius:12px;margin-bottom:8px"><button class="btn" onclick="addDate()">${t("ad")}</button></div>${list||`<p class="mut">${t("nodates")}</p>`}`}
function decay(){const now=Date.now(),c=D.cat;if(!c.t){c.t=now;save();return 0}const h=(now-c.t)/36e5;if(h<.05)return 0;c.hun=Math.max(15,c.hun-h*8);c.cln=Math.max(15,c.cln-h*4);c.fun=Math.max(15,(c.fun??60)-h*6);c.t=now;save();return h}
const _h=decay();
setInterval(()=>{decay();if(cur&&D.tab=="cat"&&!busy)render()},60000);
(()=>{const b=document.createElement("div");for(let i=0;i<10;i++){const e=document.createElement("span");e.className="fh";e.textContent=["💗","✨","🌸","🐾","⭐"][i%5];e.style.left=(i*10+Math.random()*8)+"%";e.style.animationDuration=(14+Math.random()*12)+"s";e.style.animationDelay=(-Math.random()*20)+"s";e.style.fontSize=(14+Math.random()*12)+"px";b.appendChild(e)}document.body.appendChild(b)})();
Object.assign(T.ar,{em:"الإيميل",forgot:"نسيت كلمة السر؟",denied:"هذا الحساب ليس ضمن هذا العالم 🔒",badl:"الإيميل أو كلمة السر غير صحيحة",rsent:"بعتنا رابط تغيير كلمة السر على إيميلك 📧",remail:"اكتبي الإيميل أولًا",nofb:"تعذّر الاتصال بالخادم، تأكدي من الإنترنت"});
Object.assign(T.en,{em:"Email",forgot:"Forgot password?",denied:"This account isn't part of this world 🔒",badl:"Wrong email or password",rsent:"Password reset link sent to your email 📧",remail:"Enter your email first",nofb:"Couldn't reach the server, check your connection"});
const AS={s:"loading",err:"",taken:[]};
function loginView(){const L=`<p class="mut"><button class="btn g" onclick="D.lang=D.lang=='ar'?'en':'ar';save();render()">${t("lang")}</button></p>`;let b;
if(AS.s=="loading")b=`<div style="font-size:60px;animation:bob 1.5s infinite">🐱</div>`;
else if(AS.s=="pick")b=`<p class="mut">${t("who")}</p>`+["rawan","yousef"].filter(k=>!AS.taken.includes(k)).map(k=>`<div class="av" onclick="FB.claim('${k}')">${NM[k].ic}<small>${nm(k)}</small></div>`).join("")+`<p><button class="btn g" onclick="FB.out()">${t("out")}</button></p>`;
else if(AS.s=="denied")b=`<p class="mut">${t("denied")}</p><button class="btn g" onclick="FB.out()">${t("out")}</button>`;
else b=`<p><input id="em" type="email" placeholder="${t("em")}" autocomplete="username" style="width:100%"></p><p><input id="pw2" type="password" placeholder="${t("pw")}" autocomplete="current-password" style="width:100%" onkeydown="if(event.key=='Enter')doLogin()"></p><button class="btn" onclick="doLogin()">${t("go")}</button>${AS.err?`<p class="mut">${esc(AS.err)}</p>`:""}<p><button class="btn g" onclick="FB.reset(vv('em'))">${t("forgot")}</button></p>`;
return`<div class="login card"><h1>Our Little World 🐱</h1>${b}${L}</div>`}
function doLogin(){FB.login(vv("em"),document.getElementById("pw2").value)}
window.APP={D,AS,h:_h,render:()=>render(),setCur:v=>{cur=v},getCur:()=>cur,pct:u=>pctOf(u),toast,t};
setTimeout(()=>{if(AS.s=="loading"&&!window.FB){AS.s="out";AS.err=t("nofb");render()}},8000);
render();
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyA6TDMAxQKwoqUEA22217G9lj_33e7pT9Q",authDomain:"our-little-world-7db49.firebaseapp.com",projectId:"our-little-world-7db49",storageBucket:"our-little-world-7db49.firebasestorage.app",messagingSenderId:"939906219332",appId:"1:939906219332:web:b8066e2fb54b84b400ab11"});
const auth=getAuth(app),db=getFirestore(app),A=window.APP,D=A.D,AS=A.AS;
let unsubs=[],timer=null,ready=false,loaded=false;
const clean=o=>JSON.parse(JSON.stringify(o));
const rc=()=>{const a=document.activeElement;if(!(a&&(a.tagName=="INPUT"||a.tagName=="TEXTAREA")))A.render()};
function stop(){unsubs.forEach(f=>f());unsubs=[];ready=false;loaded=false;A.setCur(null)}
function push(){if(!ready)return;clearTimeout(timer);timer=setTimeout(async()=>{const c=A.getCur(),U=D.u[c];if(!c)return;try{
await setDoc(doc(db,"world","shared"),clean({cat:D.cat,msgs:D.msgs,dates:D.dates,nudges:D.nudges,u:{[c]:{xp:U.xp,streak:U.streak,st:U.st||{},mm:U.mm||"done",pct:A.pct(c)}}}),{merge:true});
await setDoc(doc(db,"users",c),clean(c=="rawan"?{tasks:U.tasks,cyc:D.u.rawan.cyc}:{tasks:U.tasks}),{merge:true})}catch(e){A.toast("⚠️ "+(e.code||e.message))}},400)}
function start(who){A.setCur(who);ready=true;
unsubs.push(onSnapshot(doc(db,"world","shared"),s=>{if(s.metadata.hasPendingWrites)return;const d=s.data();if(!d){push();return}
if(d.cat)D.cat=Object.assign({name:""},d.cat);D.msgs=d.msgs||[];D.dates=d.dates||[];D.nudges=d.nudges||[];
for(const k in(d.u||{}))if(k!=who||!loaded)Object.assign(D.u[k],d.u[k]);loaded=true;rc()}));
unsubs.push(onSnapshot(doc(db,"users",who),s=>{if(s.metadata.hasPendingWrites)return;const d=s.data();if(!d){push();return}
if(d.tasks)D.u[who].tasks=d.tasks;if(d.cyc)D.u.rawan.cyc=Object.assign({log:[]},d.cyc);rc()}))}
onAuthStateChanged(auth,async u=>{stop();if(!u){AS.s="out";A.render();return}AS.s="loading";A.render();
try{const[r,y]=await Promise.all(["rawan","yousef"].map(k=>getDoc(doc(db,"slots",k))));
const own=r.exists()&&r.data().uid==u.uid?"rawan":y.exists()&&y.data().uid==u.uid?"yousef":null;
if(own){AS.s="ok";D.tab="home";start(own);A.render();if(A.h>3)setTimeout(()=>A.toast("🐱 "+A.t("miss")),900);return}
AS.taken=[r.exists()&&"rawan",y.exists()&&"yousef"].filter(Boolean);AS.s=AS.taken.length==2?"denied":"pick";A.render()}
catch(e){AS.s="out";AS.err=e.code||String(e);A.render()}});
window.FB={push,
async login(e,p){AS.err="";try{await signInWithEmailAndPassword(auth,e,p)}catch(x){AS.err=A.t("badl");A.render()}},
out(){signOut(auth)},
async reset(e){if(!e){A.toast(A.t("remail"));return}try{await sendPasswordResetEmail(auth,e)}catch(x){}A.toast(A.t("rsent"))},
async resetMine(){try{await sendPasswordResetEmail(auth,auth.currentUser.email);A.toast(A.t("rsent"))}catch(x){A.toast("⚠️ "+x.code)}},
async claim(k){try{await setDoc(doc(db,"slots",k),{uid:auth.currentUser.uid});AS.s="ok";D.tab="home";start(k);A.render()}catch(x){A.toast("⚠️ "+(x.code||x.message))}}};
</script>
